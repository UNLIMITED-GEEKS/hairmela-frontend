<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HairMela — Walk-in Queue for Salons</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Primary SEO -->
  <meta name="description" content="HairMela lets you join your Salons's queue from your phone. No waiting around — see your position live and show up right on time.">
  <meta name="keywords" content="barbershop queue, walk-in salon, online queue, haircut wait time, barber app, salon queue">
  <meta name="author" content="HairMela">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://hairmela.com">

  <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="HairMela">
  <meta property="og:title" content="HairMela — Walk-in Queue for Salons & Barbershops">
  <meta property="og:description" content="Join your Salon's queue from your phone. See your position live and show up right on time.">
  <meta property="og:url" content="https://hairmela.com">
  <meta property="og:image" content="https://hairmela.com/fav.jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="1200">
  <meta property="og:image:alt" content="HairMela logo">
  <meta property="og:locale" content="en_NG">

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="HairMela — Walk-in Queue for Salons & Barbershops">
  <meta name="twitter:description" content="Join your salons's queue from your phone. See your position live and show up right on time.">
  <meta name="twitter:image" content="https://hairmela.com/fav.jpeg">
  <meta name="twitter:image:alt" content="HairMela logo">

  <!-- Mobile / PWA -->
  <meta name="theme-color" content="#8B0000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HairMela">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Fonts — Poppins (used on the print-only salon poster). Angular inlines
       this @font-face CSS at build time with font-display:swap, so it never
       blocks first paint; the woff2 is fetched lazily and swapped in. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="fav.jpeg" sizes="any">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <app-root></app-root>
</body>
</html>

<div class="flex items-center justify-center min-h-screen px-6">
  <div class="w-full max-w-sm">

    @if (!hasToken()) {
      <div class="text-center space-y-4">
        <div class="w-14 h-14 rounded-full bg-red-50 flex items-center justify-center mx-auto">
          <svg class="w-7 h-7 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </div>
        <div>
          <h1 class="text-2xl font-bold text-gray-900">Invalid reset link</h1>
          <p class="mt-2 text-sm text-gray-500">This reset link is missing or invalid — request a new one.</p>
        </div>
        <a [routerLink]="forgotPasswordLink" class="inline-block text-sm font-medium text-primary hover:underline">
          Request a new link
        </a>
      </div>

    } @else {
      <div class="mb-8 text-center">
        <h1 class="text-2xl font-bold text-gray-900">Set a new password</h1>
        <p class="mt-1 text-sm text-gray-500">Choose a new password for your account.</p>
      </div>

      <form #formEl [formGroup]="form" (ngSubmit)="submit()" novalidate class="space-y-4">
        @if (errorMessage()) {
          <div class="rounded-lg bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700" role="alert">
            {{ errorMessage() }}
            <a [routerLink]="forgotPasswordLink" class="font-medium underline">Request a new link.</a>
          </div>
        }

        <div>
          <label for="rp-password" class="block text-sm font-medium text-gray-700 mb-1">New password</label>
          <input
            id="rp-password"
            type="password"
            appPasswordToggle
            formControlName="newPassword"
            autocomplete="new-password"
            class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 disabled:bg-gray-100"
            [class.border-red-400]="form.controls.newPassword.invalid && form.controls.newPassword.touched"
            placeholder="••••••••" />
          <app-field-error
            [control]="form.controls.newPassword"
            [messages]="{ minlength: 'Password must be 8–72 characters.', maxlength: 'Password must be 8–72 characters.' }" />
        </div>

        <div>
          <label for="rp-confirm" class="block text-sm font-medium text-gray-700 mb-1">Confirm password</label>
          <input
            id="rp-confirm"
            type="password"
            appPasswordToggle
            formControlName="confirm"
            autocomplete="new-password"
            class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 disabled:bg-gray-100"
            [class.border-red-400]="form.controls.confirm.invalid && form.controls.confirm.touched"
            placeholder="••••••••" />
          <app-field-error
            [control]="form.controls.confirm"
            [messages]="{ mismatch: 'Passwords don\'t match.' }" />
        </div>

        <button
          type="submit"
          [disabled]="loading()"
          class="w-full rounded-lg bg-primary px-4 py-2.5 text-sm font-semibold text-white hover:bg-primary-hover focus:outline-none focus:ring-2 focus:ring-primary/50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
          {{ loading() ? 'Resetting…' : 'Reset password' }}
        </button>
      </form>
    }

  </div>
</div>

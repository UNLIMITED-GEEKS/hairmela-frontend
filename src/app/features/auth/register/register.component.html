<div class="flex items-center justify-center min-h-screen px-6">
  <div class="w-full max-w-sm">
    <div class="mb-8 text-center">
      <h1 class="text-2xl font-bold text-gray-900">Create an account</h1>
      <p class="mt-1 text-sm text-gray-500">Join HairMela and manage your salon</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="space-y-4">

      @if (errorMessage()) {
        <div class="rounded-lg bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700" role="alert">
          {{ errorMessage() }}
          @if (errorMessage()?.includes('already exists')) {
            <a [routerLink]="loginLink" [queryParams]="loginQueryParams" class="ml-1 font-medium underline">Sign in instead</a>
          }
        </div>
      }

      <div class="flex gap-3">
        <div class="flex-1">
          <label for="firstName" class="block text-sm font-medium text-gray-700 mb-1">First name</label>
          <input
            id="firstName"
            type="text"
            formControlName="firstName"
            autocomplete="given-name"
            class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20"
            [class.border-red-400]="form.controls.firstName.invalid && form.controls.firstName.touched"
            placeholder="Ada"
          />
          <app-field-error [control]="form.controls.firstName" />
        </div>
        <div class="flex-1">
          <label for="lastName" class="block text-sm font-medium text-gray-700 mb-1">Last name</label>
          <input
            id="lastName"
            type="text"
            formControlName="lastName"
            autocomplete="family-name"
            class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20"
            [class.border-red-400]="form.controls.lastName.invalid && form.controls.lastName.touched"
            placeholder="Obi"
          />
          <app-field-error [control]="form.controls.lastName" />
        </div>
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20"
          [class.border-red-400]="form.controls.email.invalid && form.controls.email.touched"
          placeholder="you@example.com"
        />
        <app-field-error [control]="form.controls.email" />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input
          id="password"
          type="password"
          appPasswordToggle
          formControlName="password"
          autocomplete="new-password"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20"
          [class.border-red-400]="form.controls.password.invalid && form.controls.password.touched"
          placeholder="Min. 8 characters"
        />
        <app-field-error [control]="form.controls.password" />
      </div>

      <div>
        <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
        <input
          id="phone"
          type="tel"
          formControlName="phone"
          autocomplete="tel"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20"
          [class.border-red-400]="form.controls.phone.invalid && form.controls.phone.touched"
          placeholder="+234 800 000 0000"
        />
        <app-field-error [control]="form.controls.phone" />
      </div>

      <button
        type="submit"
        [disabled]="form.invalid || loading()"
        class="w-full rounded-lg bg-primary px-4 py-2.5 text-sm font-semibold text-white hover:bg-primary-hover focus:outline-none focus:ring-2 focus:ring-primary/50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
      >
        {{ loading() ? 'Creating account…' : 'Create account' }}
      </button>

    </form>

    <p class="mt-6 text-center text-sm text-gray-500">
      Already have an account?
      <a [routerLink]="loginLink" [queryParams]="loginQueryParams" class="font-medium text-primary hover:underline">Sign in</a>
    </p>
  </div>
</div>

<div class="flex items-center justify-center min-h-screen px-6">
  <div class="w-full max-w-sm">
    <div class="mb-8 text-center">
      <h1 class="text-2xl font-bold text-text-primary">Welcome back</h1>
      <p class="mt-1 text-sm text-text-secondary">Sign in to your HairMela account</p>
    </div>

    <form #formEl [formGroup]="form" (ngSubmit)="submit()" novalidate class="space-y-4">

      @if (justRegistered()) {
        <div class="rounded-lg bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-700" role="status">
          Account created! Sign in to continue.
        </div>
      }

      @if (justReset()) {
        <div class="rounded-lg bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-700" role="status">
          Password reset! Sign in with your new password.
        </div>
      }

      @if (errorMessage()) {
        <div class="rounded-lg bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700" role="alert">
          {{ errorMessage() }}
        </div>
      }

      <div>
        <label for="email" class="block text-sm font-medium text-text-body mb-1">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          class="w-full rounded-lg border border-border-strong px-3 py-2 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 disabled:bg-surface-overlay"
          [class.border-red-400]="form.controls.email.invalid && form.controls.email.touched"
          placeholder="you@example.com"
        />
        <app-field-error [control]="form.controls.email" />
      </div>

      <div>
        <div class="flex items-center justify-between mb-1">
          <label for="password" class="block text-sm font-medium text-text-body">Password</label>
          <a [routerLink]="forgotPasswordLink" class="text-xs font-medium text-primary hover:underline">Forgot password?</a>
        </div>
        <input
          id="password"
          type="password"
          appPasswordToggle
          formControlName="password"
          autocomplete="current-password"
          class="w-full rounded-lg border border-border-strong px-3 py-2 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 disabled:bg-surface-overlay"
          [class.border-red-400]="form.controls.password.invalid && form.controls.password.touched"
          placeholder="••••••••"
        />
        <app-field-error [control]="form.controls.password" />
      </div>

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full rounded-lg bg-primary px-4 py-2.5 text-sm font-semibold text-white hover:bg-primary-hover focus:outline-none focus:ring-2 focus:ring-primary/50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
      >
        {{ loading() ? 'Signing in…' : 'Sign in' }}
      </button>

    </form>

    <p class="mt-6 text-center text-sm text-text-secondary">
      Don't have an account?
      <a [routerLink]="registerLink" [queryParams]="registerQueryParams" class="font-medium text-primary hover:underline">Sign up</a>
    </p>

    <!-- Back home. Points at "/" on every platform — HomeShellComponent
         resolves that to the marketing landing on web and the app welcome
         screen when installed, so one link covers both with no platform check.
         Matters most on iOS standalone, which has no hardware back button. -->
    <a routerLink="/"
      class="mt-4 flex items-center justify-center gap-2 min-h-11 w-full rounded-xl border border-border text-text-muted text-sm font-medium hover:bg-surface-sunken transition-colors">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
      Back to home
    </a>
  </div>
</div>

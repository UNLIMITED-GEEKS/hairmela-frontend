<div class="flex items-center justify-center min-h-screen px-6">
  <div class="w-full max-w-sm">

    @if (sent()) {
      <div class="text-center space-y-4">
        <div class="w-14 h-14 rounded-full bg-green-50 flex items-center justify-center mx-auto">
          <svg class="w-7 h-7 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
        </div>
        <div>
          <h1 class="text-2xl font-bold text-text-primary">Check your email</h1>
          <p class="mt-2 text-sm text-text-secondary">
            If an account exists for that email, we've sent a reset link. It expires in 1 hour.
          </p>
        </div>
        <a [routerLink]="loginLink" class="inline-block text-sm font-medium text-primary hover:underline">
          Back to sign in
        </a>
      </div>

    } @else {
      <div class="mb-8 text-center">
        <h1 class="text-2xl font-bold text-text-primary">Forgot password</h1>
        <p class="mt-1 text-sm text-text-secondary">Enter your email and we'll send a reset link.</p>
      </div>

      <form #formEl [formGroup]="form" (ngSubmit)="submit()" novalidate class="space-y-4">
        <div>
          <label for="fp-email" class="block text-sm font-medium text-text-body mb-1">Email</label>
          <input
            id="fp-email"
            type="email"
            formControlName="email"
            autocomplete="email"
            class="w-full rounded-lg border border-border-strong px-3 py-2 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 disabled:bg-surface-overlay"
            [class.border-red-400]="form.controls.email.invalid && form.controls.email.touched"
            placeholder="you@example.com" />
          <app-field-error [control]="form.controls.email" />
        </div>

        <button
          type="submit"
          [disabled]="loading()"
          class="w-full rounded-lg bg-primary px-4 py-2.5 text-sm font-semibold text-white hover:bg-primary-hover focus:outline-none focus:ring-2 focus:ring-primary/50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
          {{ loading() ? 'Sending…' : 'Send reset link' }}
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-text-secondary">
        Remember your password?
        <a [routerLink]="loginLink" class="font-medium text-primary hover:underline">Sign in</a>
      </p>
    }

  </div>
</div>

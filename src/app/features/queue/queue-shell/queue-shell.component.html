<app-connection-banner />

@if (console.loading()) {
  <div class="h-screen-minus-topbar bg-surface px-4 py-8">
    <div class="max-w-lg mx-auto">
      <app-skeleton variant="card" [count]="2" />
    </div>
  </div>
} @else if (staffFrozen()) {
  <div class="h-screen-minus-topbar bg-surface flex items-center justify-center px-4">
    <div class="max-w-sm text-center space-y-3">
      <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-amber-100">
        <svg class="h-6 w-6 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>
      <h1 class="text-lg font-bold text-gray-900">Console locked</h1>
      <p class="text-sm text-gray-500">
        Your salon has more staff than its plan allows, so your queue controls are paused.
        Ask the owner to upgrade to restore access.
      </p>
      <button type="button" (click)="_location.back()"
        class="inline-block rounded-lg border border-gray-300 px-5 py-2.5 text-sm font-semibold text-gray-700 hover:bg-surface transition-colors">
        Go back
      </button>
    </div>
  </div>
} @else {
  <div class="h-screen-minus-topbar bg-surface flex flex-col">

    <!-- Top bar: back + status pills + call next -->
    <div class="shrink-0 bg-surface border-b border-gray-100 px-4 pt-4 md:pt-2  space-y-2">

      <p class="text-xs text-gray-400 mb-1 ml-11">Tap to open, pause, or close your queue</p>
      <div class="flex items-center gap-2">
        <app-back-button variant="plain" />
        <div class="flex items-center gap-1.5 flex-wrap flex-1 min-w-0">
          @for (s of statusOptions; track s) {
            <button
              (click)="setStatus(s)"
              [disabled]="console.acting() || console.queueStatus() === null || console.queueStatus() === s"
              [class]="'px-3 min-h-9 rounded-xl border text-xs font-semibold transition-colors disabled:cursor-not-allowed ' +
                (console.queueStatus() === s
                  ? (s === 'OPEN'   ? 'bg-primary text-white  shadow-sm'
                   : s === 'PAUSED' ? 'bg-warning text-white border-warning shadow-sm'
                                    : 'bg-red-600 text-white border-red-600 shadow-sm')
                  : 'bg-white text-gray-500 border-gray-300 hover:bg-gray-50 hover:border-gray-400 disabled:opacity-40')">
              {{ s === 'OPEN' ? 'Open' : s === 'PAUSED' ? 'Pause' : 'Close' }}
            </button>
          }
        </div>
      </div>

      <button
        (click)="callNext()"
        [disabled]="console.queueStatus() !== 'OPEN' || console.waitingEntries().length === 0 || console.hasServingEntry() || console.nextIsLocked()"
        class="w-full py-2.5 mt-2 rounded-xl bg-primary text-white text-sm font-semibold disabled:opacity-40 transition-opacity whitespace-nowrap">
        Click To Serve Next Client
      </button>
    </div>

    <!-- Page content — overflow-hidden here previously clipped the routed
         pages' md:static desktop action bar (position: fixed on mobile
         bypasses it, but static content actually needs to render within
         normal flow). Each routed page already manages its own internal
         scroll region (flex-1 overflow-y-auto), so this isn't load-bearing. -->
    <div class="flex-1 min-h-0">
      <router-outlet />
    </div>

  </div>
}

<div class="bg-surface-card rounded-2xl shadow-sm border border-border-subtle p-6">
  <div class="flex items-start justify-between gap-4">
    <div>
      <h2 class="text-sm font-semibold text-text-primary">Password</h2>
      <p class="text-sm text-text-secondary mt-0.5">
        @if (sent()) {
          Check your email for a reset link. It expires in 1 hour.
        } @else {
          We'll email you a link to reset your password.
        }
      </p>
    </div>
    @if (!sent()) {
      <button
        type="button"
        (click)="sendLink()"
        [disabled]="loading()"
        class="shrink-0 min-h-10 px-4 text-sm font-medium text-primary border border-primary/30 rounded-lg
               hover:bg-primary/5 disabled:opacity-50 transition-colors">
        {{ loading() ? 'Sending…' : 'Reset password' }}
      </button>
    } @else {
      <span class="shrink-0 text-xs font-medium text-green-600 bg-green-50 px-2.5 py-1 rounded-full">Link sent</span>
    }
  </div>
</div>

<div class="py-6 px-4">

  <div class="max-w-lg mx-auto space-y-6">
    <div class="flex items-center gap-3">
      <a routerLink="/dashboard" class="text-gray-500 hover:text-gray-700">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </a>
      <h1 class="text-xl font-semibold text-gray-900">Account</h1>
    </div>

    <app-verify-email-banner />

    @if (_currentUser.user(); as user) {
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 flex items-center gap-4">
        <div class="w-14 h-14 rounded-full bg-primary flex items-center justify-center text-white text-lg font-bold shrink-0">
          {{ initials }}
        </div>
        <div class="min-w-0">
          <p class="text-base font-semibold text-gray-900 truncate">{{ user.firstName }} {{ user.lastName }}</p>
          <p class="text-sm text-gray-500 truncate">{{ user.email }}</p>
          @if (user.phone) {
            <p class="text-sm text-gray-400 truncate">{{ user.phone }}</p>
          }
        </div>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 divide-y divide-gray-100">
        <div class="px-6 py-4 flex justify-between items-center">
          <span class="text-sm text-gray-500">Email verified</span>
          @if (user.emailVerified) {
            <span class="text-xs font-medium text-green-600 bg-green-50 px-2 py-0.5 rounded-full">Verified</span>
          } @else {
            <span class="text-xs font-medium text-amber-600 bg-amber-50 px-2 py-0.5 rounded-full">Pending</span>
          }
        </div>
        <div class="px-6 py-4 flex justify-between items-center">
          <span class="text-sm text-gray-500">Member since</span>
          <span class="text-sm text-gray-700">{{ user.createdAt | date:'mediumDate' }}</span>
        </div>
      </div>

      <app-reset-password />

      <app-notifications-toggle />

      <button
        (click)="_auth.logout()"
        class="w-full py-3 rounded-xl border border-red-200 text-red-600 text-sm font-medium hover:bg-red-50 transition-colors min-h-11">
        Log out
      </button>
    } @else {
      <div class="py-16">
        <app-skeleton variant="avatar-row" [count]="1" />
      </div>
    }
  </div>
</div>

<div class="bg-surface-card rounded-xl border border-border p-5">
  <div class="flex items-center justify-between gap-4">
    <div class="min-w-0">
      <p class="text-sm font-semibold text-text-primary">Queue sound</p>
      <p class="mt-0.5 text-sm text-text-secondary">
        Play a sound on your queue console when your queue changes.
      </p>
    </div>

    @if (enabled()) {
      <button type="button" (click)="disable()"
        class="shrink-0 rounded-lg border border-border-strong px-4 py-2 text-sm font-semibold text-text-body hover:bg-surface-sunken transition-colors">
        Turn off
      </button>
    } @else {
      <button type="button" (click)="enable()"
        class="shrink-0 rounded-lg bg-primary px-4 py-2 text-sm font-semibold text-white hover:bg-primary-hover transition-colors">
        Turn on
      </button>
    }
  </div>
</div>

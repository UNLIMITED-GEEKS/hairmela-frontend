@if (loading()) {
  <div class="py-6 px-4">

    <div class="">
      <app-skeleton variant="line" [count]="3" />
    </div>
  </div>
} @else {
  <div class="py-6 px-4">

    <div class="">
      <h1 class="text-xl font-semibold text-gray-900 mb-2">Salon URL</h1>
      <p class="text-sm text-gray-500 mb-6">
        This is the public link customers use to join your queue. Changing it will break any printed QR codes.
      </p>

      <form [formGroup]="form" (ngSubmit)="save()" class="bg-white rounded-xl border border-gray-200 p-5 space-y-5">

        <div>
          <label for="slug" class="block text-sm font-medium text-gray-700 mb-1.5">Slug</label>
          <div class="flex items-center border border-gray-300 rounded-lg overflow-hidden
                      focus-within:ring-2 focus-within:ring-primary/40 focus-within:border-primary transition-colors">
            <span class="px-3 py-2.5 text-sm text-gray-400 bg-gray-50 border-r border-gray-300 shrink-0">
              /s/
            </span>
            <input id="slug" type="text" formControlName="slug"
              class="flex-1 min-h-11 px-3 py-2.5 text-sm focus:outline-none" />
          </div>
          <app-field-error
            [control]="form.controls.slug"
            [messages]="{ taken: 'This slug is already taken. Try another.', pattern: 'Only lowercase letters, numbers, and hyphens allowed.' }" />
        </div>

        <button type="submit" [disabled]="form.invalid"
          class="w-full min-h-11 bg-primary text-white text-sm font-medium rounded-lg
                 hover:bg-primary-dark disabled:opacity-50 active:scale-95 transition-all">
          Save slug
        </button>

      </form>
    </div>
  </div>
}

@if (loading()) {
  <!-- Mirrors the loaded form: one outlined card with labelled fields and a
       submit button. -->
  <div class="py-6 px-4">
    <div class="max-w-lg mx-auto bg-surface-card rounded-xl border border-border p-5 space-y-5">
      @for (field of [1, 2]; track field) {
        <div class="space-y-1.5">
          <app-skeleton variant="block" height="0.875rem" width="6rem" rounded="rounded" />
          <app-skeleton variant="block" height="2.75rem" />
        </div>
      }
      <app-skeleton variant="block" height="2.75rem" />
    </div>
  </div>
} @else {
  <div class="py-6 px-4">

    <div class="">
      <h1 class="text-xl font-semibold text-text-primary mb-2">Salon URL</h1>
      <p class="text-sm text-text-secondary mb-6">
        This is the public link customers use to join your queue. Changing it will break any printed QR codes.
      </p>

      <form #formEl [formGroup]="form" (ngSubmit)="save()" class="bg-surface-card rounded-xl border border-border p-5 space-y-5">

        <div>
          <label for="slug" class="block text-sm font-medium text-text-body mb-1.5">Slug</label>
          <div class="flex items-center border border-border-strong rounded-lg overflow-hidden
                      focus-within:ring-2 focus-within:ring-primary/40 focus-within:border-primary transition-colors">
            <span class="px-3 py-2.5 text-sm text-text-disabled bg-surface-sunken border-r border-border-strong shrink-0">
              /s/
            </span>
            <input id="slug" type="text" formControlName="slug"
              class="flex-1 min-h-11 px-3 py-2.5 text-sm focus:outline-none" />
          </div>
          <app-field-error
            [control]="form.controls.slug"
            [messages]="{ taken: 'This slug is already taken. Try another.', pattern: 'Only lowercase letters, numbers, and hyphens allowed.' }" />
        </div>

        <button type="submit"
          class="w-full min-h-11 bg-primary text-white text-sm font-medium rounded-lg
                 hover:bg-primary-dark disabled:opacity-50 active:scale-95 transition-all">
          Save slug
        </button>

      </form>
    </div>
  </div>
}

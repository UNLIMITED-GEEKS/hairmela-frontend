@if (loading()) {
  <div class="py-6 px-4">

    <div class="">
      <app-skeleton variant="card" [count]="2" />
    </div>
  </div>
} @else {
  <div class="">
    <app-page-header title="Share your salon" backVariant="glass" />

    <div class="space-y-6 pt-3 pb-6 px-4">

      <p class="text-base text-text-body -mt-4">Customers scan the QR code or open the link to join your queue.</p>

      <!-- QR code -->
      <div class="bg-surface-card rounded-xl border border-border p-6 flex flex-col items-center gap-4">
        @if (qrDataUrl()) {
          <img [src]="qrDataUrl()" alt="QR code for salon queue" class="w-48 h-48" />
        } @else {
          <div class="w-48 h-48 bg-surface-overlay rounded-lg flex items-center justify-center">
            <app-skeleton variant="circle" width="192px" height="192px" />
          </div>
        }

        <div class="flex flex-col sm:flex-row gap-2 w-full">
        
          <button type="button" (click)="downloadPoster()"
            [disabled]="!posterUrl() || downloadingPoster()"
            class="flex-1 min-h-11 px-6 py-2.5 border border-border-strong text-text-body text-sm font-medium rounded-lg
                   hover:bg-surface-sunken disabled:opacity-50 active:scale-95 transition-all
                   flex items-center justify-center gap-2">
            @if (downloadingPoster()) {
              <app-inline-spinner sizeClass="w-4 h-4" label="Preparing poster" />
              <span>Preparing…</span>
            } @else {
              <span>Download poster</span>
            }
          </button>
            <button type="button" (click)="downloadQr()" [disabled]="!qrDataUrl()"
            class="flex-1 min-h-11 px-6 py-2.5 border border-border-strong text-text-body text-sm font-medium rounded-lg
                   hover:bg-surface-sunken disabled:opacity-50 active:scale-95 transition-all">
            Download PNG
          </button>
        </div>
      </div>

      <!-- Share URL -->
      <div class="bg-surface-card rounded-xl border border-border p-5 space-y-3">
        <p class="text-sm font-medium text-text-body">Share link</p>
        <div class="flex flex-col gap-2">
          <input type="text" [value]="shareUrl()" readonly
            class="w-full min-w-0 min-h-11 px-3 py-2.5 text-sm border border-border-strong rounded-lg bg-surface-sunken text-text-muted overflow-hidden text-ellipsis" />
          <button type="button" (click)="copyLink()"
            class="w-full min-h-11 px-4 py-2.5 bg-primary text-white text-sm font-medium rounded-lg
                   hover:bg-primary-dark active:scale-95 transition-all">
            Copy link
          </button>
        </div>
      </div>

    </div>
  </div>
}

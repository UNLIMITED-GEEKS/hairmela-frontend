@if (loading()) {
  <div class="py-6 px-4">

    <div class="">
      <app-skeleton variant="card" [count]="2" />
    </div>
  </div>
} @else {
  <div class="">
    <app-page-header backVariant="glass" />

    <div class="space-y-4 px-4 pb-6 pt-3">
      <p class="text-base text-text-body -mt-1">Customers scan the QR code or open the link to join your queue.</p>

      <div class="rounded-[20px] border border-border bg-surface-card p-4 sm:p-5">
        <div class="space-y-3">
          <p class="text-sm font-medium text-text-body">{{'Copy link' }}</p>
          <input type="text" [value]="shareUrl()" readonly
            class="w-full min-w-0 min-h-11 rounded-lg border border-border bg-surface-sunken px-3 py-2.5 text-sm text-text-muted outline-none" />
          <button type="button" (click)="copyLink()"
            class="w-full min-h-11 rounded-lg bg-primary px-4 py-2.5 text-sm font-medium text-white transition-all hover:bg-primary-dark active:scale-[0.98]">
            Copy link
          </button>
        </div>
      </div>

      <div class="rounded-[20px] border border-border bg-surface-card p-4 sm:p-5">
        <div class="flex flex-col items-center gap-4">
          @if (qrDataUrl()) {
            <img [src]="qrDataUrl()" alt="QR code for salon queue" class="h-48 w-48" />
          } @else {
            <div class="flex h-48 w-48 items-center justify-center rounded-lg bg-surface-overlay">
              <app-skeleton variant="circle" width="192px" height="192px" />
            </div>
          }

          <div class="flex w-full flex-col gap-2 sm:flex-row">
            <button type="button" (click)="downloadPoster()"
              [disabled]="!posterUrl() || downloadingPoster()"
              class="flex min-h-11 flex-1 items-center justify-center gap-2 rounded-lg border border-border-strong px-6 py-2.5 text-sm font-medium text-text-body transition-all hover:bg-surface-sunken disabled:opacity-50 active:scale-[0.98]">
              @if (downloadingPoster()) {
                <app-inline-spinner sizeClass="w-4 h-4" label="Preparing poster" />
                <span>Preparing…</span>
              } @else {
                <span>Download poster</span>
              }
            </button>
            <button type="button" (click)="downloadQr()" [disabled]="!qrDataUrl()"
              class="min-h-11 flex-1 rounded-lg border border-border-strong px-6 py-2.5 text-sm font-medium text-text-body transition-all hover:bg-surface-sunken disabled:opacity-50 active:scale-[0.98]">
              Download PNG
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
}

@if (loading()) {
 <div class="py-6 px-4">

    <div class="">
      <app-skeleton variant="list-item" [count]="8" />
    </div>
  </div>
} @else {
  <app-page-header title="Salon Settings" backVariant="glass" />
  <div class="pb-6 px-4">
    <div class="">

      <form [formGroup]="form" (ngSubmit)="save()" [tierFreeze]="salonContext.isFrozen()" class="space-y-6">

        <!-- Actions — sticky to the top of the page's scroll container
             (auth-shell's <main>), not fixed to the bottom, so it's always
             reachable without depending on the shell's height math or the
             sidebar's width on desktop. -->
        <div class="sticky top-6 md:top-0 z-20 -mx-4 px-4 py-3 bg-surface border-b border-gray-100 flex gap-3">
          <button type="button" (click)="_location.back()"
            class="flex-1 min-h-11 flex items-center justify-center border border-gray-300 text-gray-700
                   text-sm font-medium rounded-lg hover:bg-gray-50 transition-colors">
            Cancel
          </button>
          <button type="submit" [disabled]="form.invalid"
            class="flex-1 min-h-11 bg-primary text-white text-sm font-medium rounded-lg
                   hover:bg-primary-dark disabled:opacity-50 active:scale-95 transition-all">
            Save changes
          </button>
        </div>

        @if (salonContext.isFrozen()) {
          <div>
            <app-frozen-banner />
          </div>
        }

        <!-- General -->
        <div class="bg-white rounded-xl border border-gray-200 p-5 space-y-4">
          <h2 class="text-sm font-semibold text-gray-700">General</h2>

          <div>
            <label for="s-name" class="block text-sm font-medium text-gray-700 mb-1.5">Salon name</label>
            <input id="s-name" type="text" formControlName="name"
              class="w-full min-h-11 px-3 py-2.5 text-sm border border-gray-300 rounded-lg
                     focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition-colors" />
            <app-field-error [control]="form.controls.name" />
          </div>

          <div>
            <label for="s-phone" class="block text-sm font-medium text-gray-700 mb-1.5">Phone</label>
            <input id="s-phone" type="tel" formControlName="phone"
              class="w-full min-h-11 px-3 py-2.5 text-sm border border-gray-300 rounded-lg
                     focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition-colors" />
            <app-field-error [control]="form.controls.phone" />
          </div>

          <div>
            <label for="s-about" class="block text-sm font-medium text-gray-700 mb-1.5">
              About <span class="text-gray-400 font-normal">(optional)</span>
            </label>
            <textarea id="s-about" formControlName="about" rows="8"
              placeholder="Tell customers about your salon…"
              class="w-full px-3 py-2.5 text-sm border border-gray-300 rounded-lg resize-none
                     focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition-colors">
            </textarea>
            <app-field-error [control]="form.controls.about" [messages]="{ maxlength: 'Keep it under 1000 characters.' }" />
          </div>

          <div>
            <label for="s-tz" class="block text-sm font-medium text-gray-700 mb-1.5">Timezone</label>
            <select id="s-tz" formControlName="timezone"
              class="w-full min-h-11 px-3 py-2.5 text-sm border border-gray-300 rounded-lg bg-white
                     focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition-colors">
              @for (tz of timezones; track tz) {
                <option [value]="tz">{{ tz }}</option>
              }
            </select>
            <app-field-error [control]="form.controls.timezone" />
          </div>

          <div>
            <label for="s-slot" class="block text-sm font-medium text-gray-700 mb-1.5">Default slot duration (mins)</label>
            <input id="s-slot" type="number" formControlName="defaultSlotDuration" min="5" max="240"
              class="w-full min-h-11 px-3 py-2.5 text-sm border border-gray-300 rounded-lg
                     focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition-colors" />
            <app-field-error [control]="form.controls.defaultSlotDuration" />
          </div>
        </div>

        <!-- Pricing -->
        <div class="bg-white rounded-xl border border-gray-200 p-5 space-y-4">
          <h2 class="text-sm font-semibold text-gray-700">Pricing</h2>

          <label class="flex items-center justify-between min-h-11 cursor-pointer">
            <span>
              <span class="block text-sm text-gray-700">Show prices to customers</span>
              <span class="block text-xs text-gray-400">If enabled, customers will see the price of each service before joining the queue.</span>
            </span>
            <input type="checkbox" formControlName="showPrice"
              class="w-4 h-4 rounded border-gray-300 text-primary focus:ring-primary/40 shrink-0" />
          </label>
        </div>

        <!-- Queue settings -->
        <div class="bg-white rounded-xl border border-gray-200 p-5 space-y-4">
          <h2 class="text-sm font-semibold text-gray-700">Queue</h2>

          <!-- Allow walk-ins toggle hidden for now — form control (allowWalkIns,
               defaults true) stays wired and still submits on save.
          <label class="flex items-center justify-between min-h-11 cursor-pointer">
            <span class="text-sm text-gray-700">Allow walk-ins</span>
            <input type="checkbox" formControlName="allowWalkIns"
              class="w-4 h-4 rounded border-gray-300 text-primary focus:ring-primary/40" />
          </label>
          -->

          <div>
            <label for="s-party" class="block text-sm font-medium text-gray-700 mb-1.5">Max party size</label>
            <input id="s-party" type="number" formControlName="maxPartySize" min="1" max="20"
              class="w-full min-h-11 px-3 py-2.5 text-sm border border-gray-300 rounded-lg
                     focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition-colors" />
            <app-field-error [control]="form.controls.maxPartySize" />
          </div>

          <div>
            <label for="s-noshow" class="block text-sm font-medium text-gray-700 mb-1.5">No-show window (mins)</label>
            <input id="s-noshow" type="number" formControlName="noShowWindow" min="1"
              class="w-full min-h-11 px-3 py-2.5 text-sm border border-gray-300 rounded-lg
                     focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition-colors" />
            <app-field-error [control]="form.controls.noShowWindow" />
          </div>
        </div>

        <!-- Operating hours -->
        <div class="bg-white rounded-xl border border-gray-200 p-5 space-y-1" formArrayName="operatingHours">
          <h2 class="text-sm font-semibold text-gray-700 mb-2">Opening hours</h2>
          @for (day of hoursArray.controls; track $index) {
            <div [formGroupName]="$index" class="py-2 border-b border-gray-100 last:border-0">
              <label class="flex items-center gap-2 cursor-pointer min-h-11">
                <input type="checkbox" formControlName="enabled"
                  class="w-4 h-4 rounded border-gray-300 text-primary focus:ring-primary/40 shrink-0" />
                <span class="text-sm font-medium text-gray-700 flex-1">{{ days[$index] }}</span>
                @if (!day.get('enabled')?.value) {
                  <span class="text-xs text-gray-400">Closed</span>
                }
              </label>
              @if (day.get('enabled')?.value) {
                <div class="flex items-center gap-2 mt-2 pl-6">
                  <input type="time" formControlName="startTime"
                    class="flex-1 min-w-0 min-h-10 px-2 py-1.5 text-sm border border-gray-300 rounded-lg
                           focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition-colors" />
                  <span class="text-xs text-gray-400 shrink-0">to</span>
                  <input type="time" formControlName="endTime"
                    class="flex-1 min-w-0 min-h-10 px-2 py-1.5 text-sm border border-gray-300 rounded-lg
                           focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition-colors" />
                </div>
              }
            </div>
          }
        </div>

      </form>
    </div>
  </div>
}

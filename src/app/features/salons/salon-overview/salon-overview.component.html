@if (loading()) {
  <div class="min-h-screen bg-gray-50 flex items-center justify-center">
    <span class="inline-block w-8 h-8 border-2 border-primary border-t-transparent rounded-full animate-spin"></span>
  </div>
} @else if (salon(); as salon) {
  <div class="min-h-screen bg-gray-50 px-4 py-8">
    <div class="max-w-lg mx-auto space-y-6">

      <!-- Header -->
      <div>
        <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Salon</p>
        <h1 class="text-2xl font-bold text-gray-900">{{ salon.name }}</h1>
        <p class="text-sm text-gray-500 mt-0.5">{{ salon.address.city }}, {{ salon.address.country }}</p>
      </div>

      <!-- Quick actions -->
      <div class="bg-white rounded-xl border border-gray-200 divide-y divide-gray-100">

        <a [routerLink]="['staff']"
          class="flex items-center justify-between px-5 py-4 min-h-14 hover:bg-gray-50 transition-colors">
          <span class="text-sm font-medium text-gray-900">Staff</span>
          <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </a>

        <a [routerLink]="['services']"
          class="flex items-center justify-between px-5 py-4 min-h-14 hover:bg-gray-50 transition-colors">
          <span class="text-sm font-medium text-gray-900">Services</span>
          <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </a>

        <a *hasRole="['OWNER', 'ADMIN']" [routerLink]="['media']"
          class="flex items-center justify-between px-5 py-4 min-h-14 hover:bg-gray-50 transition-colors">
          <span class="text-sm font-medium text-gray-900">Photos</span>
          <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </a>

        <a *hasRole="['OWNER', 'ADMIN']" [routerLink]="['settings']"
          class="flex items-center justify-between px-5 py-4 min-h-14 hover:bg-gray-50 transition-colors">
          <span class="text-sm font-medium text-gray-900">Settings</span>
          <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </a>

        <a *hasRole="['OWNER', 'ADMIN']" [routerLink]="['share']"
          class="flex items-center justify-between px-5 py-4 min-h-14 hover:bg-gray-50 transition-colors">
          <span class="text-sm font-medium text-gray-900">Share / QR code</span>
          <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </a>

        <a *hasRole="['OWNER']" [routerLink]="['delete']"
          class="flex items-center justify-between px-5 py-4 min-h-14 hover:bg-red-50 transition-colors">
          <span class="text-sm font-medium text-red-600">Delete salon</span>
          <svg class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </a>

      </div>

    </div>
  </div>
}

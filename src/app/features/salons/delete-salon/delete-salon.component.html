<div class="">
  <app-page-header title="Delete Salon" backVariant="glass" />
  <div class="space-y-3 py-4 px-4">

    <p class="text-base text-text-body -mt-4">This action is permanent and cannot be undone.</p>

    <div class="bg-surface-card rounded-xl border border-red-200 p-5 space-y-3">
      <h2 class="text-sm font-semibold text-red-700">What happens when you delete</h2>
      <ul class="space-y-2 text-sm text-text-muted">
        <li class="flex items-start gap-2">
          <span class="mt-0.5 text-red-400 shrink-0">•</span>
          All active queues will be closed immediately
        </li>
        <li class="flex items-start gap-2">
          <span class="mt-0.5 text-red-400 shrink-0">•</span>
          All waiting entries will be cancelled
        </li>
        <li class="flex items-start gap-2">
          <span class="mt-0.5 text-red-400 shrink-0">•</span>
          Customers in the queue will be notified
        </li>
        <li class="flex items-start gap-2">
          <span class="mt-0.5 text-red-400 shrink-0">•</span>
          Staff members will lose access to this salon
        </li>
      </ul>
    </div>

    <button
      type="button"
      (click)="confirmDelete()"
      [disabled]="deleting() || !salonName()"
      class="w-full min-h-11 bg-red-600 text-white text-sm font-medium rounded-lg
             hover:bg-red-700 disabled:opacity-50 active:scale-95 transition-all">
      {{ deleting() ? 'Deleting…' : 'Delete "' + salonName() + '"' }}
    </button>

  </div>
</div>

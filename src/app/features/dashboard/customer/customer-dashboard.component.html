<div class="space-y-6">

  <!-- Greeting -->
  <div>
    <h1 class="text-2xl font-bold text-text-primary">Hi, {{ firstName() }} 👋</h1>
    <p class="text-sm text-text-secondary mt-0.5">Welcome to HairMela</p>
  </div>

  <!-- CTA -->

    <svg class="w-4 h-4 text-text-secondary shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>

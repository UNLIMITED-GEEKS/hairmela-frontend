<div class="space-y-2 mt-8">
  <div class="flex items-center justify-between mb-1">
    <h2 class="text-sm font-semibold text-text-secondary uppercase tracking-wide">Active Visits</h2>
    <a [routerLink]="queuesLink"
      class="text-xs font-medium text-primary hover:text-primary/80 transition-colors">
      View all
    </a>
  </div>

  @for (entry of entries(); track entry.id) {
    <button
      (click)="goToPosition(entry)"
      class="w-full flex items-center gap-3 bg-surface-card border border-border rounded-2xl px-4 py-3 text-left hover:border-primary/30 hover:shadow-card transition-all min-h-[60px]">
      <span class="shrink-0 w-2.5 h-2.5 rounded-full"
        [class]="entry.status === 'WAITING' ? 'bg-warning' : entry.status === 'SERVING' ? 'bg-success' : 'bg-surface-strong'">
      </span>

      <div class="flex-1 min-w-0">
        <p class="text-sm font-semibold text-text-primary truncate">{{ salonName(entry) }}</p>
        <p class="text-xs text-text-secondary mt-0.5">
          {{ leaderName(entry) }}
          @if (partyCount(entry) > 1) {
            <span> + {{ partyCount(entry) - 1 }} {{ partyCount(entry) - 1 === 1 ? 'other' : 'others' }}</span>
          }
        </p>
      </div>

      <span class="shrink-0 text-xs font-medium px-2 py-0.5 rounded-full capitalize"
        [class]="entry.status === 'SERVING' ? 'bg-success/10 text-success' : 'bg-warning/10 text-warning'">
        {{ entry.status.toLowerCase() }}
      </span>

      <svg class="shrink-0 w-4 h-4 text-text-disabled" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
      </svg>
    </button>
  }
</div>

@if (loading()) {
  <div class="py-6 px-4">
    <app-skeleton variant="card" [count]="3" />
  </div>
} @else {
  <div class="py-6 px-4">
    <app-pending-invites />
    @if (isCustomer()) {
      <app-customer-dashboard [firstName]="user()?.firstName ?? ''" />
    } @else if (activeSalon(); as salon) {
      @if (isOwnerOrAdmin()) {
        <app-owner-admin-dashboard [salon]="salon" [firstName]="user()?.firstName ?? ''" />
      } @else if (isStaff()) {
        <app-staff-dashboard [salon]="salon" [firstName]="user()?.firstName ?? ''" />
      }
    }
  </div>
}

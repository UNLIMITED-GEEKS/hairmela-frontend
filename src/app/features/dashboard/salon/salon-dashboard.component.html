<div class="min-h-dvh bg-gray-50 px-4 py-8">
  <div class="max-w-lg mx-auto">
    <h1 class="text-xl font-semibold text-gray-900 mb-1">Dashboard</h1>
    <p class="text-sm text-gray-500 mb-8">Manage your salons and staff.</p>

    <!-- My salons -->
    @if (salons().length > 0) {
      <h2 class="text-sm font-semibold text-gray-700 uppercase tracking-wide mb-3">My Salons</h2>
      <app-my-salons-list [salons]="salons()" />
    } @else {
      <app-no-salons-empty-state
        message="You have no salons yet."
        ctaLabel="Create a salon"
        (ctaClick)="navigateToCreateSalon()" />
    }
  </div>
</div>

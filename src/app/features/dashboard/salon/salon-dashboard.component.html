<div class="py-6 px-4">

  <div class="max-w-lg mx-auto">
    <h1 class="text-xl font-semibold text-gray-900 mb-1">Dashboard</h1>
    <p class="text-sm text-gray-500 mb-8">Manage your salons and staff.</p>

    <app-pending-invites />

    <!-- My salons -->
    @if (salons().length > 0) {
      <h2 class="text-sm font-semibold text-gray-700 uppercase tracking-wide mb-3">My Salons</h2>
      <app-my-salons-list [salons]="salons()" />
      <a [routerLink]="newSalonLink"
        class="mt-4 flex items-center justify-center gap-2 w-full min-h-12 rounded-2xl border-2 border-dashed border-primary/30 text-primary text-sm font-medium hover:bg-primary-light/40 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        Create salon
      </a>
    } @else {
      <app-no-salons-empty-state
        message="You have no salons yet."
        ctaLabel="Create a salon"
        (ctaClick)="navigateToCreateSalon()" />
    }
  </div>
</div>

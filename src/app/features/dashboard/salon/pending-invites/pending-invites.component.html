@if (_invites.loading()) {
  <div class="flex justify-center py-6">
    <div class="w-6 h-6 rounded-full border-2 border-primary border-t-transparent animate-spin"></div>
  </div>
} @else if (_invites.invites().length > 0) {
  <div class="mb-6">
    <h2 class="text-sm font-semibold text-gray-700 uppercase tracking-wide mb-3">Pending Invites</h2>
    <div class="space-y-2">
      @for (invite of _invites.invites(); track invite.staffId) {
        <div class="bg-white rounded-xl border border-amber-200 p-4 flex items-center gap-3 min-h-16">
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-gray-900 truncate">{{ invite.salonName }}</p>
            <p class="text-xs text-gray-400 truncate">You've been invited as {{ invite.role | lowercase }}</p>
          </div>
          <div class="flex gap-2 shrink-0">
            <button
              type="button"
              (click)="_invites.decline(invite)"
              [disabled]="_invites.responding() !== null"
              class="min-h-9 px-3 py-1.5 text-xs font-medium text-gray-600 border border-gray-300 rounded-lg
                     hover:bg-gray-50 disabled:opacity-50 transition-colors">
              Decline
            </button>
            <button
              type="button"
              (click)="_invites.accept(invite)"
              [disabled]="_invites.responding() !== null"
              class="min-h-9 px-3 py-1.5 text-xs font-medium text-white bg-primary rounded-lg
                     hover:bg-primary-dark disabled:opacity-50 transition-colors">
              {{ _invites.responding() === invite.staffId ? '…' : 'Accept' }}
            </button>
          </div>
        </div>
      }
    </div>
  </div>
}

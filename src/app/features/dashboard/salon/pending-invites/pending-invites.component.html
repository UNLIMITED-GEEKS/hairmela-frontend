@if (!loading() && invites().length > 0) {
  <div class="mb-6">
    <h2 class="text-sm font-semibold text-gray-700 uppercase tracking-wide mb-3">Pending Invites</h2>
    <div class="space-y-2">
      @for (invite of invites(); track invite.id) {
        <div class="bg-white rounded-xl border border-amber-200 p-4 flex items-center gap-3 min-h-[64px]">
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-gray-900 truncate">{{ invite.title }}</p>
            <p class="text-xs text-gray-400 truncate">{{ invite.message }}</p>
          </div>
          <div class="flex gap-2 shrink-0">
            <button
              type="button"
              (click)="decline(invite)"
              [disabled]="actioning() !== null"
              class="min-h-9 px-3 py-1.5 text-xs font-medium text-gray-600 border border-gray-300 rounded-lg
                     hover:bg-gray-50 disabled:opacity-50 transition-colors">
              Decline
            </button>
            <button
              type="button"
              (click)="accept(invite)"
              [disabled]="actioning() !== null"
              class="min-h-9 px-3 py-1.5 text-xs font-medium text-white bg-primary rounded-lg
                     hover:bg-primary-dark disabled:opacity-50 transition-colors">
              @if (actioning() === invite.id) {
                <span class="inline-block w-3 h-3 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
              } @else {
                Accept
              }
            </button>
          </div>
        </div>
      }
    </div>
  </div>
}

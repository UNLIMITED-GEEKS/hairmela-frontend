@if (visit.loading()) {

  <div class="h-mobile-content">

    <!-- Hero photo. Same heights as the real header, so the sheet below starts
         at the same offset and nothing jumps on load. -->
    <div class="h-56 md:h-100 w-full"><app-skeleton variant="block" height="100%" /></div>

    <!-- Content sheet — the -mt-6 overlap and rounded top are the real ones. -->
    <div class="relative -mt-6 rounded-t-3xl bg-surface px-4 pt-5 pb-6">

      <!-- Open/closed status pill -->
      <app-skeleton variant="block" height="1.5rem" width="5rem" rounded="rounded-full" />

      <!-- Salon name and address -->
      <div class="mt-3 space-y-2">
        <app-skeleton variant="block" height="1.5rem" width="12rem" rounded="rounded" />
        <app-skeleton variant="block" height="1rem" width="14rem" rounded="rounded" />
      </div>

      <!-- Primary action -->
      <div class="mt-5 w-full"><app-skeleton variant="block" height="3rem" rounded="rounded-2xl" /></div>

      <!-- About / Services / Staffs tabs -->
      <div class="mt-6 flex gap-2">
        @for (tab of [1, 2, 3]; track tab) {
          <div class="flex-1"><app-skeleton variant="block" height="2.25rem" /></div>
        }
      </div>

      <!-- Services list -->
      <div class="mt-5">
        <app-skeleton variant="list-item" [count]="4" />
      </div>
    </div>
  </div>
} @else {
  <router-outlet />
}

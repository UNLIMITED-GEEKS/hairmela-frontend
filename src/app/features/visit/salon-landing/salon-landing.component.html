<div class="py-6 px-4">

  <div class="max-w-md mx-auto space-y-5">

    <!-- Salon avatar + "Open Now" badge -->
    <div class="flex justify-center relative mb-2">
      <div class="w-24 h-24 rounded-full border-2 border-primary flex items-center justify-center bg-primary-light">
        <svg class="w-12 h-12 text-primary/60" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
      </div>
      <span class="absolute bottom-0 right-[calc(50%-52px)] translate-x-full -translate-y-1
                   text-xs font-semibold px-3 py-1 rounded-full
                   bg-success-light text-success border border-success/20">
        Open Now
      </span>
    </div>

    @if (visit.salon(); as s) {
      <div class="w-full rounded-2xl border-2 border-primary bg-warning-light px-5 py-4 text-center">
        <h1 class="text-xl font-bold text-warning">{{ s.name }}</h1>
      </div>
      <div class="w-full rounded-2xl border border-gray-200 px-5 py-3">
        <p class="text-sm text-gray-500">{{ s.address?.city ? s.address.city + ' — ' : '' }}Barbers in {{ s.name }}</p>
      </div>
    }

    <!-- Barber cards -->
    <div class="flex flex-wrap gap-3">
      @for (staff of visit.staffList(); track staff.staffId) {
        <button
          (click)="selectBarber(staff)"
          [disabled]="!staff.queueId"
          class="flex-1 min-w-30 rounded-2xl border-2 border-primary bg-warning-light
                 px-4 py-4 flex flex-col items-center gap-2
                 hover:bg-warning/20 transition-colors
                 disabled:opacity-50 disabled:cursor-not-allowed">
          <div class="w-10 h-10 rounded-full border-2 border-primary bg-white flex items-center justify-center">
            <svg class="w-5 h-5 text-primary/50" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          </div>
          <span class="text-sm font-semibold text-gray-800">{{ staff.firstName }}</span>
          @if (staff.queueId) {
            <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-success-light text-success border border-success/20">
              Available
            </span>
          } @else {
            <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-primary-light text-primary border border-primary/20">
              Unavailable
            </span>
          }
        </button>
      }
    </div>

  </div>
</div>

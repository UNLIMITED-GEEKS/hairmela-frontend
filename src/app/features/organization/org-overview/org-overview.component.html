@if (loading()) {
  <!-- Mirrors the loaded page: org title, the Current Plan card, then the
       divided list of salons. -->
  <div class="py-6 px-4">
    <div class="max-w-lg mx-auto space-y-4">
      <app-skeleton variant="block" height="1.75rem" width="12rem" rounded="rounded" />

      <div class="bg-surface-card rounded-xl border border-border p-5 space-y-3">
        <app-skeleton variant="block" height="1rem" width="7rem" rounded="rounded" />
        <app-skeleton variant="block" height="0.875rem" width="10rem" rounded="rounded" />
        <app-skeleton variant="block" height="2.5rem" width="8rem" />
      </div>

      <div class="divide-y divide-border-subtle rounded-xl border border-border bg-surface-card">
        @for (row of [1, 2, 3]; track row) {
          <div class="flex items-center gap-3 px-4 py-4">
            <div class="shrink-0"><app-skeleton variant="block" height="2.5rem" width="2.5rem" rounded="rounded-xl" /></div>
            <div class="min-w-0 flex-1 space-y-1.5">
              <app-skeleton variant="block" height="1rem" width="8rem" rounded="rounded" />
              <app-skeleton variant="block" height="0.75rem" width="6rem" rounded="rounded" />
            </div>
          </div>
        }
      </div>
    </div>
  </div>
} @else if (error()) {
  <div class="py-16 flex flex-col items-center gap-3">
    <p class="text-sm text-text-secondary">Failed to load organisation.</p>
    <button type="button" (click)="retry()"
      class="px-4 py-2 text-sm font-medium text-primary border border-primary rounded-lg hover:bg-primary/5 transition-colors">
      Retry
    </button>
  </div>
} @else if (org(); as org) {
  <div class="py-6 px-4">

    <div class="max-w-lg mx-auto space-y-6">

      <!-- Header -->
      <div>
        <p class="text-xs text-text-disabled uppercase tracking-wide mb-1">Organisation</p>
        <h1 class="text-2xl font-bold text-text-primary">{{ org.name }}</h1>
      </div>

      <!-- Plan card -->
      <div class="bg-surface-card rounded-xl border border-border p-5 space-y-3">
        <h2 class="text-sm font-semibold text-text-body">Current Plan</h2>
        <div class="flex items-center justify-between">
          <span class="text-base font-medium text-text-primary">Free</span>
          <a
            [routerLink]="planSegment"
            class="text-sm text-primary font-medium hover:underline">
            View plans
          </a>
        </div>
        <p class="text-xs text-text-disabled">Contact us to upgrade your plan.</p>
      </div>

      <!-- Actions -->
      <div class="bg-surface-card rounded-xl border border-border divide-y divide-border-subtle">
        <a
          [routerLink]="settingsSegment"
          class="flex items-center justify-between px-5 py-4 min-h-14 hover:bg-surface-sunken transition-colors">
          <span class="text-sm font-medium text-text-primary">Organisation settings</span>
          <svg class="w-4 h-4 text-text-disabled" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </a>
      </div>

    </div>
  </div>
}

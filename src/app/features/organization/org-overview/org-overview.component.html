@if (loading()) {
  <div class="min-h-screen bg-gray-50 flex items-center justify-center">
    <span class="inline-block w-8 h-8 border-2 border-primary border-t-transparent rounded-full animate-spin"></span>
  </div>
} @else if (org(); as org) {
  <div class="min-h-screen bg-gray-50 px-4 py-8">
    <div class="max-w-lg mx-auto space-y-6">

      <!-- Header -->
      <div>
        <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Organisation</p>
        <h1 class="text-2xl font-bold text-gray-900">{{ org.name }}</h1>
      </div>

      <!-- Plan card -->
      <div class="bg-white rounded-xl border border-gray-200 p-5 space-y-3">
        <h2 class="text-sm font-semibold text-gray-700">Current Plan</h2>
        <div class="flex items-center justify-between">
          <span class="text-base font-medium text-gray-900">Free</span>
          <a
            routerLink="plan"
            class="text-sm text-primary font-medium hover:underline">
            View plans
          </a>
        </div>
        <p class="text-xs text-gray-400">Contact us to upgrade your plan.</p>
      </div>

      <!-- Actions -->
      <div class="bg-white rounded-xl border border-gray-200 divide-y divide-gray-100">
        <a
          routerLink="settings"
          class="flex items-center justify-between px-5 py-4 min-h-[56px] hover:bg-gray-50 transition-colors">
          <span class="text-sm font-medium text-gray-900">Organisation settings</span>
          <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </a>
      </div>

    </div>
  </div>
}

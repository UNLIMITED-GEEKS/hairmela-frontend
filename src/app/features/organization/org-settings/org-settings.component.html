@if (loading()) {
  <div class="py-6 px-4">

    <div class="max-w-lg mx-auto">
      <app-skeleton variant="line" [count]="3" />
    </div>
  </div>
} @else {
 <div class="py-6 px-4">

    <div class="max-w-lg mx-auto">

      <h1 class="text-xl font-semibold text-text-primary mb-6">Organisation Settings</h1>

      <form #formEl [formGroup]="form" (ngSubmit)="save()" class="bg-surface-card rounded-xl border border-border p-5 space-y-5">

        <div>
          <label for="org-name" class="block text-sm font-medium text-text-body mb-1.5">
            Organisation name
          </label>
          <input
            id="org-name"
            type="text"
            formControlName="name"
            class="w-full min-h-11 px-3 py-2.5 text-sm border border-border-strong rounded-lg
                   focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary
                   disabled:bg-surface-sunken disabled:text-text-disabled transition-colors"
            placeholder="My Organisation" />
          <app-field-error [control]="form.controls.name" />
        </div>

        <button
          type="submit"
          class="w-full min-h-11 bg-primary text-white text-sm font-medium rounded-lg
                 hover:bg-primary-dark disabled:opacity-50 active:scale-95 transition-all">
          Save changes
        </button>

      </form>
    </div>
  </div>
}

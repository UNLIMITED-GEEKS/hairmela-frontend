@if (loading()) {
  <!-- Mirrors the form card below: one outlined card of labelled fields
       (category, name, duration, price, description) then the submit row. -->
  <div class="py-6 px-4">
    <div class="bg-surface-card rounded-xl border border-border p-5 space-y-4">
      @for (field of [1, 2, 3, 4, 5]; track field) {
        <div class="space-y-1.5">
          <app-skeleton variant="block" height="0.875rem" width="7rem" rounded="rounded" />
          <app-skeleton variant="block" height="2.75rem" />
        </div>
      }
      <app-skeleton variant="block" height="2.75rem" />
    </div>
  </div>
} @else {
  <app-page-header [title]="isEdit() ? 'Edit service' : 'New service'" backVariant="glass" />
  <div class="pb-6 px-4">
    <div class="space-y-6">
      @if (salonContext.isFrozen()) {
        <div class="mb-6">
          <app-frozen-banner />
        </div>
      }

      <form
        #formEl
        [formGroup]="form"
        (ngSubmit)="save()"
        [tierFreeze]="salonContext.isFrozen()"
        class="space-y-6"
      >
        <!-- Actions — sticky to the top of the page's scroll container
             (auth-shell's <main>), not fixed to the bottom, so it's always
             reachable without depending on the shell's height math or the
             sidebar's width on desktop. Same pattern as salon-settings. -->
        <div
          class="sticky top-6 md:top-0 z-20 -mx-4 px-4 py-3 bg-surface border-b border-border-subtle flex gap-3"
        >
          <button
            type="button"
            (click)="_location.back()"
            class="flex-1 min-h-11 flex items-center justify-center border border-border-strong text-text-body text-sm font-medium rounded-lg hover:bg-surface-sunken transition-colors"
          >
            Cancel
          </button>
          <button
            type="submit"
            [disabled]="submitting()"
            class="flex-1 min-h-11 bg-primary text-white text-sm font-medium rounded-lg hover:bg-primary/90 disabled:opacity-50 transition-colors flex items-center justify-center gap-2"
          >
            {{ isEdit() ? 'Save changes' : 'Create service' }}
          </button>
        </div>

        <div class="bg-surface-card rounded-xl border border-border p-5 space-y-4">
          <!-- Category -->
          <div class="space-y-1.5">
            <div class="flex items-center justify-between gap-3">
              <label for="service-category" class="text-sm font-medium text-text-body flex items-center gap-2">
                Category
                @if (categoriesService.loading() || customCategoriesLoading()) {
                  <app-inline-spinner sizeClass="w-3.5 h-3.5" label="Loading categories" />
                }
              </label>
              <button type="button" (click)="categoryError.set(null); categoryDialogOpen.set(true)"
                [disabled]="salonContext.isFrozen()"
                class="min-h-9 px-3 inline-flex items-center justify-center rounded-lg border border-primary text-sm font-semibold text-primary hover:bg-primary/10 focus:outline-none focus:ring-2 focus:ring-primary/30 disabled:opacity-50 transition-colors">
                Create new custom category
              </button>
            </div>
            <select
              id="service-category"
              formControlName="categoryId"
              [disabled]="categoriesService.loading() || customCategoriesLoading()"
              class="w-full min-h-11 px-3 rounded-lg border border-border-strong text-sm bg-surface-card focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary disabled:opacity-50"
            >
              <option value="" disabled>
                {{ categoriesService.loading() ? 'Loading…' : 'Select a category' }}
              </option>
              <optgroup label="Default">
                @for (cat of categoriesService.categories(); track cat.id) {
                  <option [value]="cat.id">{{ cat.name }}</option>
                }
              </optgroup>
              <optgroup label="Custom category">
                @for (cat of customCategories(); track cat.id) {
                  <option [value]="'custom:' + cat.id">{{ cat.name }}</option>
                }
              </optgroup>
            </select>
            <app-field-error [control]="form.get('categoryId')" />
          </div>

          <!-- Name -->
          <div class="space-y-1.5">
            <label class="text-sm font-medium text-text-body">Service name</label>
            <input
              formControlName="name"
              type="text"
              placeholder="e.g. Classic Haircut"
              class="w-full min-h-11 px-3 rounded-lg border border-border-strong text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary disabled:bg-surface-sunken"
              [class.border-red-400]="form.get('name')?.invalid && form.get('name')?.touched"
            />
            <app-field-error [control]="form.get('name')" />
          </div>

          <!-- Duration -->
          <div class="space-y-1.5">
            <label class="text-sm font-medium text-text-body">Duration (minutes)</label>
            <input
              formControlName="duration"
              type="number"
              min="2"
              placeholder="30"
              class="w-full min-h-11 px-3 rounded-lg border border-border-strong text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary"
              [class.border-red-400]="
                form.get('duration')?.invalid && form.get('duration')?.touched
              "
            />
            <app-field-error
              [control]="form.get('duration')"
              [messages]="{ min: 'Duration must be at least 2 minutes' }"
            />
          </div>

          <!-- Price -->
          <div class="space-y-1.5">
            <label class="text-sm font-medium text-text-body"
              >Price ({{ salonContext.currency() }})</label
            >
            <input
              formControlName="price"
              type="number"
              min="0"
              step="0.01"
              placeholder="0.00"
              class="w-full min-h-11 px-3 rounded-lg border border-border-strong text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary"
              [class.border-red-400]="form.get('price')?.invalid && form.get('price')?.touched"
            />
            <app-field-error
              [control]="form.get('price')"
              [messages]="{ min: 'Price cannot be negative' }"
            />
          </div>

          <!-- Description -->
          <div class="space-y-1.5">
            <label class="text-sm font-medium text-text-body">
              Description <span class="text-text-disabled font-normal">(optional)</span>
            </label>
            <textarea
              formControlName="description"
              rows="2"
              placeholder="Short description…"
              class="w-full px-3 py-2.5 rounded-lg border border-border-strong text-sm resize-none focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary"
            >
            </textarea>
          </div>

          <!-- Dynamic pricing — checked, customers see "Price based on your
               preference" instead of the price amount everywhere it's shown. -->
          <div class="space-y-1.5 mb-10">
            <label class="flex items-start gap-2.5 cursor-pointer">
              <input
                type="checkbox"
                formControlName="isDynamicPricing"
                class="w-4 h-4 mt-0.5 rounded border-border-strong text-primary focus:ring-primary/30"
              />
              <span>
                <span class="block text-sm font-medium text-text-body">Dynamic pricing</span>
                <span class="block text-xs text-text-disabled mt-0.5">
                  If checked, customers see "Price is based on your choosen style" instead of a
                  price amount.
                </span>
              </span>
            </label>
          </div>

          <!-- Staff who offer this service — non-blocking: doesn't gate submit,
               just travels along with the create/update request so no separate
               per-staff assignment call is needed afterward. -->
          <div class="space-y-1.5">
            <label class="text-sm font-medium text-text-body flex items-center gap-2">
              Assign Staffs who offer this service
              <span class="text-text-disabled font-normal">(optional)</span>
              @if (staffLoading()) {
                <app-inline-spinner sizeClass="w-3.5 h-3.5" label="Loading staff" />
              }
            </label>
            @if (!staffLoading() && assignableStaff().length === 0) {
              <p class="text-xs text-text-disabled">No active staff to assign yet.</p>
            } @else {
              <div class="space-y-1.5 rounded-lg border border-border p-2">
                @for (s of assignableStaff(); track s.staff.id) {
                  <label
                    class="flex items-center gap-2.5 px-2 py-2 rounded-lg hover:bg-surface-sunken cursor-pointer"
                  >
                    <input
                      type="checkbox"
                      [checked]="isStaffChecked(s.staff.id)"
                      (change)="toggleStaff(s.staff.id, $any($event.target).checked)"
                      class="w-4 h-4 rounded border-border-strong text-primary focus:ring-primary/30"
                    />
                    <span class="text-sm text-text-body truncate">{{ staffName(s.staff) }}</span>
                    @if (!s.staff.isAcceptingClients) {
                      <span class="text-xs text-text-disabled shrink-0">Not accepting clients</span>
                    }
                  </label>
                }
              </div>
            }
          </div>
        </div>
      </form>
    </div>
  </div>
}

<!-- The submit step. Opened by save() once the form validates; confirming it
     is what actually fires the create/update request.
     [staff] is assignableStaff(), NOT the raw list: it filters to ACTIVE staff
     (the backend rejects assigning anyone else) and hides staff who are not
     accepting clients unless they are already assigned. -->
<app-assign-staff-dialog
  [open]="assignOpen()"
  [staff]="assignableStaff()"
  [loading]="staffLoading()"
  [selectedIds]="form.controls.staffIds.value ?? []"
  [confirmLabel]="isEdit() ? 'Save changes' : 'Create service'"
  (confirmed)="onAssignConfirmed($event)"
  (closed)="assignOpen.set(false)"
/>

<app-create-category-dialog
  [open]="categoryDialogOpen()"
  [saving]="categoryCreating()"
  [error]="categoryError()"
  (created)="createCategory($event)"
  (closed)="categoryDialogOpen.set(false)"
/>

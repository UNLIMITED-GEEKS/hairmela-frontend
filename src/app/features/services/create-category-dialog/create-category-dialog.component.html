@if (open()) {
  <div class="fixed inset-0 z-50 flex items-end justify-center bg-black/40 px-4 pb-4 sm:items-center sm:pb-0"
    role="dialog" aria-modal="true" aria-labelledby="create-category-title">
    <form (ngSubmit)="submit()" class="w-full max-w-sm rounded-3xl bg-surface p-6 shadow-xl">
      <h2 id="create-category-title" class="text-lg font-bold text-text-primary">New custom category</h2>
      <p class="mt-1 text-sm text-text-secondary">Only this salon can use this category.</p>

      <label for="custom-category-name" class="mt-5 block text-sm font-medium text-text-body">Category name</label>
      <input id="custom-category-name" name="categoryName" type="text" maxlength="100" autocomplete="off"
        [ngModel]="name()" (ngModelChange)="name.set($event)" [disabled]="saving()"
        class="mt-1.5 w-full min-h-11 rounded-lg border border-border-strong bg-surface-card px-3 text-sm text-text-primary focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary disabled:opacity-50" />
      @if (error(); as message) {
        <p class="mt-2 text-xs text-error" role="alert">{{ message }}</p>
      }

      <div class="mt-6 flex gap-3">
        <button type="button" (click)="close()" [disabled]="saving()"
          class="flex-1 min-h-11 rounded-lg border border-border-strong text-sm font-medium text-text-body hover:bg-surface-sunken disabled:opacity-50">
          Cancel
        </button>
        <button type="submit" [disabled]="saving() || name().trim().length < 2 || name().trim().length > 100"
          class="flex-1 min-h-11 rounded-lg bg-primary text-sm font-medium text-white hover:bg-primary-hover disabled:opacity-50 inline-flex items-center justify-center gap-2">
          @if (saving()) { <app-inline-spinner sizeClass="w-4 h-4" label="Creating category" /> }
          Create category
        </button>
      </div>
    </form>
  </div>
}

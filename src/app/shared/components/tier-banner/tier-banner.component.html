@if (visible()) {
  @let b = banner()!;
  <div
    class="rounded-xl border px-4 py-3 mb-4"
    [class.bg-blue-50]="b.kind === 'trial'"
    [class.border-blue-200]="b.kind === 'trial'"
    [class.bg-red-50]="b.kind === 'expired'"
    [class.border-red-200]="b.kind === 'expired'"
    [class.bg-amber-50]="b.kind === 'free'"
    [class.border-amber-200]="b.kind === 'free'"
    role="status"
    aria-live="polite">
    <div class="flex items-center gap-3">
      <p
        class="flex-1 min-w-0 text-sm"
        [class.text-blue-800]="b.kind === 'trial'"
        [class.text-red-800]="b.kind === 'expired'"
        [class.text-amber-800]="b.kind === 'free'">
        {{ b.message }}
      </p>

      @if (canUpgrade()) {
        <!-- A filled button, not bare text: this is the banner's whole point,
             and as plain coloured words it read as part of the sentence rather
             than as the thing to tap. Kept per-kind so it stays tonally with
             the banner it sits in, rather than a brand-pink button dropped on
             a red or amber panel.
             Amber is -700 where the others are -600: white on amber-600 is
             only 3.19:1, under AA for text this size, while amber-700 gives
             5.02:1. -->
        <button
          type="button"
          (click)="upgrade()"
          class="shrink-0 rounded-lg px-3 py-1.5 text-sm font-semibold text-white transition-colors"
          [class.bg-blue-600]="b.kind === 'trial'"
          [class.hover:bg-blue-700]="b.kind === 'trial'"
          [class.bg-red-600]="b.kind === 'expired'"
          [class.hover:bg-red-700]="b.kind === 'expired'"
          [class.bg-amber-700]="b.kind === 'free'"
          [class.hover:bg-amber-800]="b.kind === 'free'">
          {{ b.cta }}
        </button>
      }

      @if (dismissible()) {
        <button
          type="button"
          (click)="dismiss()"
          aria-label="Dismiss"
          class="shrink-0 text-amber-400 hover:text-amber-600 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      }
    </div>
  </div>
}

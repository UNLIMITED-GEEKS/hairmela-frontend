@if (state() !== 'hidden') {
  <div
    class="fixed inset-x-3 bottom-[calc(env(safe-area-inset-bottom)+0.75rem)] z-[100] mx-auto flex max-w-md items-center justify-center gap-2 rounded-xl px-4 py-3 text-center text-sm font-semibold text-white shadow-lg"
    [class.bg-red-600]="state() === 'offline'"
    [class.bg-green-600]="state() === 'restored'"
    style="--status-banner-height: 3rem"
    animate.enter="status-banner-enter"
    animate.leave="status-banner-leave"
    role="status"
    aria-live="polite"
  >
    @if (state() === 'offline') {
      <svg class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6.4 6.4a8 8 0 0111.2 0M9.2 9.2a4 4 0 015.6 0M12 13h.01M3 3l18 18" />
      </svg>
      No internet connection
    } @else {
      <svg class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
      </svg>
      Internet connection restored
    }
  </div>
}

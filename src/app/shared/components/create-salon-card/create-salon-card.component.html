@if (canAddSalon()) {
  <a [routerLink]="newSalonLink"
    class="flex items-center justify-between w-full bg-primary text-white border border-border rounded-2xl px-5 py-4 hover:bg-primary-hover transition-colors">
    <div>
      <p class="text-sm font-semibold text-white whitespace-nowrap">Click here to create a salon</p>
     
    </div>
    <svg class="w-4 h-4 text-white shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
    </svg>
  </a>
} @else {
  <button type="button" (click)="viewPlans()"
    class="flex items-center justify-between w-full bg-white border border-border rounded-2xl px-5 py-4 hover:bg-surface-overlay transition-colors text-left">
    <div>
      <p class="text-sm font-semibold text-text-primary">Create a salon</p>
      <p class="text-xs text-text-secondary mt-0.5">You've reached your plan's salon limit — upgrade to add more</p>
    </div>
    <svg class="w-4 h-4 text-amber-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
    </svg>
  </button>
}

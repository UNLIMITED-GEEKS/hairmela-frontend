@if (canAddSalon()) {
  <a [routerLink]="newSalonLink" class="flex min-h-13 items-center gap-3 px-4 text-sm text-text-secondary transition-colors hover:bg-surface-sunken">
    <svg class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 3l18 18M3 21L21 3M8.5 8.5l4 4m3-3l-4 4" />
    </svg>
    <span class="flex-1">Create Salon</span>
    <svg class="h-4 w-4 shrink-0 text-text-disabled" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m9 18 6-6-6-6" />
    </svg>
  </a>
} @else {
  <button type="button" (click)="viewPlans()" class="flex min-h-13 w-full items-center gap-3 px-4 text-left text-sm text-text-secondary transition-colors hover:bg-surface-sunken">
    <svg class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 3l18 18M3 21L21 3M8.5 8.5l4 4m3-3l-4 4" />
    </svg>
    <span class="flex-1">Create Salon <span class="text-xs text-text-disabled">· View plans</span></span>
    <svg class="h-4 w-4 shrink-0 text-text-disabled" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m9 18 6-6-6-6" />
    </svg>
  </button>
}

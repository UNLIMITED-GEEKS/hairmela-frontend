@if (available) {
  <button
    type="button"
    (click)="signIn()"
    [disabled]="disabled() || loading()"
    aria-label="Continue with Apple"
    title="Continue with Apple"
    class="w-full min-h-11 inline-flex items-center justify-center gap-3 rounded-full border border-border-strong bg-black px-4 py-2.5 text-sm font-semibold text-white hover:bg-black/85 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
  >
    @if (loading()) {
      <app-inline-spinner sizeClass="w-4 h-4" label="Opening Apple sign-in" />
    } @else {
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path
          d="M17.05 12.54c-.03-3.01 2.46-4.47 2.57-4.54a5.5 5.5 0 0 0-4.33-2.34c-1.82-.19-3.59 1.09-4.52 1.09-.95 0-2.39-1.07-3.94-1.04a5.76 5.76 0 0 0-4.85 2.96c-2.1 3.63-.53 8.97 1.48 11.91 1.01 1.45 2.18 3.07 3.73 3.01 1.52-.06 2.09-.97 3.92-.97 1.82 0 2.36.97 3.94.93 1.63-.02 2.66-1.45 3.63-2.91a11.9 11.9 0 0 0 1.66-3.38 5.2 5.2 0 0 1-3.29-4.72ZM14.1 3.73A5.28 5.28 0 0 0 15.31 0a5.38 5.38 0 0 0-3.48 1.77 5.05 5.05 0 0 0-1.24 3.59 4.45 4.45 0 0 0 3.51-1.63Z"
        />
      </svg>
    }
    Continue with Apple
  </button>
}

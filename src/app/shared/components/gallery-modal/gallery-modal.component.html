@if (open()) {
  <div
    #dialogEl
    animate.enter="gallery-modal-enter"
    animate.leave="gallery-modal-leave"
    class="fixed inset-0 z-[100] bg-black/90 flex flex-col outline-none"
    role="dialog"
    aria-modal="true"
    aria-label="Photo gallery"
    tabindex="-1"
    (keydown)="onKeydown($event)">

    <!-- Close -->
    <button type="button" (click)="close()"
      class="absolute top-4 right-4 z-10 w-10 h-10 rounded-full bg-surface-card/10 hover:bg-surface-card/20 flex items-center justify-center text-white transition-colors"
      aria-label="Close gallery">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>

    <!-- Main image track — touch-action: none so the browser doesn't claim
         the gesture as a page scroll/pan before pointermove sees it. Without
         this, drag/swipe works with a mouse (no such ambiguity) but silently
         does nothing on a real touchscreen. -->
    <div class="flex-1 relative overflow-hidden flex items-center touch-none" #trackWrap
      (pointerdown)="onPointerDown($event, trackWrap)"
      (pointermove)="onPointerMove($event)"
      (pointerup)="onPointerUp()"
      (pointercancel)="onPointerUp()">
      <div class="flex w-full h-full" [style]="trackStyle()">
        @for (img of images(); track img) {
          <div class="w-full h-full shrink-0 flex items-center justify-center px-4">
            <img [src]="img | mediaUrl" alt="" class="max-w-full max-h-full object-contain select-none pointer-events-none" draggable="false" />
          </div>
        }
      </div>

      @if (images().length > 1) {
        <button type="button" (click)="prev()"
          class="absolute left-2 sm:left-4 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-surface-card/10 hover:bg-surface-card/20 flex items-center justify-center text-white transition-colors"
          aria-label="Previous image">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        <button type="button" (click)="next()"
          class="absolute right-2 sm:right-4 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-surface-card/10 hover:bg-surface-card/20 flex items-center justify-center text-white transition-colors"
          aria-label="Next image">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
          </svg>
        </button>
      }
    </div>

    <!-- Thumbnail strip -->
    @if (images().length > 1) {
      <div #thumbStrip class="shrink-0 min-w-0 w-full flex gap-2 overflow-x-auto overscroll-x-contain touch-pan-x px-4 py-4 themed-scrollbar"
        style="-webkit-overflow-scrolling: touch;">
        @for (img of images(); track img; let i = $index) {
          <button #thumbBtn type="button" (click)="jumpTo(i)"
            [class]="'shrink-0 w-14 h-14 rounded-lg overflow-hidden border-2 transition-colors ' +
              (i === activeIndex() ? 'border-white' : 'border-transparent opacity-60 hover:opacity-100')"
            [attr.aria-label]="'Go to image ' + (i + 1)"
            [attr.aria-current]="i === activeIndex()">
            <img [src]="img | mediaUrl:'thumb'" alt="" class="w-full h-full object-cover" />
          </button>
        }
      </div>
    }
  </div>
}

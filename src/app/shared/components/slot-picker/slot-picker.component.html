<div>
  <label class="block text-sm font-medium text-text-body mb-1.5">
    Date
    <ng-content select="[slotPickerDateHint]" />
  </label>
  <app-mini-month-calendar
    [viewedMonth]="viewedMonth()"
    [selectedDate]="selectedDate()"
    [minDate]="minDate()"
    [badgeFor]="badgeFor()"
    (monthChange)="onMonthChange($event)"
    (daySelect)="onDaySelect($event)" />
</div>

@if (selectedDate()) {
  <div class="mt-4">
    <label class="block text-sm font-medium text-text-body mb-1.5">Time</label>
    @if (slotsLoading()) {
      <p class="flex items-center gap-2 text-sm text-text-secondary">
        <app-inline-spinner sizeClass="w-4 h-4" label="Loading available times" />
        <span>Loading available times…</span>
      </p>
    } @else if (selectedDaySlots().length === 0) {
      <p class="text-sm text-text-secondary">No slots available this day, try another date.</p>
    } @else {
      <div class="grid grid-cols-3 gap-2">
        @for (slot of selectedDaySlots(); track slot.startTime) {
          <button type="button" (click)="selectSlot(slot)"
            [class]="'min-h-10 rounded-xl text-sm font-medium border transition-colors ' +
              (selectedStartTime() === slot.startTime
                ? 'bg-primary text-white border-primary'
                : 'bg-surface-card text-text-body border-border-strong hover:bg-secondary-light')">
            {{ formatTime(slot.startTime) }}
          </button>
        }
      </div>
    }
  </div>
}

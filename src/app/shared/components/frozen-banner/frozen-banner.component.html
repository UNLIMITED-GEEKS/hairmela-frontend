@if (frozen()) {
  <div class="rounded-xl border border-amber-300 bg-amber-50 p-4" role="status">
    <div class="flex items-start gap-3">
      <svg class="w-5 h-5 text-amber-500 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
      </svg>
      <div class="min-w-0">
        <p class="text-sm font-semibold text-amber-900">This salon is frozen</p>
        <p class="mt-0.5 text-sm text-amber-800">
          @if (canManage()) {
            It's over your plan's salon limit, so it's read-only. Upgrade to reactivate it — no data is lost.
          } @else {
            It's over the plan's limit and is currently read-only. Ask the owner to upgrade to reactivate it.
          }
        </p>
        @if (canManage()) {
          <button type="button" (click)="upgrade()"
            class="mt-3 inline-block rounded-lg bg-primary px-4 py-2 text-sm font-semibold text-white hover:bg-primary-hover transition-colors">
            Upgrade to reactivate
          </button>
        }
      </div>
    </div>
  </div>
}

<div #scroller class="flex gap-2 overflow-x-auto themed-scrollbar no-scrollbar pb-1 ">
  <button type="button" (click)="select.emit('')"
    [attr.data-selected]="selected() === '' ? 'true' : null"
    [class]="'shrink-0 flex items-center justify-center min-h-9 min-w-20 px-4 md:px-10 rounded-xl text-sm font-semibold border transition-colors ' +
      (selected() === ''
        ? 'bg-primary text-white border-primary'
        : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50')">
    All
  </button>
  @for (cat of categories(); track cat.id) {
    <button type="button" (click)="select.emit(cat.slug)"
      [attr.data-selected]="selected() === cat.slug ? 'true' : null"
      [class]="'shrink-0 flex items-center justify-center min-h-9 min-w-20 px-4 md:px-6 rounded-xl text-sm font-semibold border transition-colors ' +
        (selected() === cat.slug
          ? 'bg-primary text-white border-primary'
          : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50')">
      {{ cat.name }}
    </button>
  }
</div>

<div class="flex items-center justify-between mb-3">
  <button type="button" (click)="prevMonth()" aria-label="Previous month"
    class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-surface-overlay transition-colors">
    <svg class="w-4 h-4 text-text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
    </svg>
  </button>
  <h2 class="text-base font-bold text-text-primary">{{ monthLabel() }}</h2>
  <button type="button" (click)="nextMonth()" aria-label="Next month"
    class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-surface-overlay transition-colors">
    <svg class="w-4 h-4 text-text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
    </svg>
  </button>
</div>

<!-- Weekday header row -->
<div class="grid grid-cols-7 text-center text-xs font-semibold text-text-disabled mb-1">
  @for (d of ['S', 'M', 'T', 'W', 'T', 'F', 'S']; track $index) {
    <div class="py-1">{{ d }}</div>
  }
</div>

<!-- Month grid -->
<div class="space-y-1">
  @for (week of weeks(); track $index) {
    <div class="grid grid-cols-7 gap-1">
      @for (cell of week; track cell.iso) {
        <!-- Spill-over days from the neighbouring months get no tile background
             and dimmer text, so the viewed month reads as one solid block.
             Text colour alone stopped being enough once text-faint was lifted
             for contrast in dark mode — the two became near-identical. -->
        <button type="button" (click)="selectDay(cell)" [disabled]="cell.disabled"
          class="aspect-square rounded-xl flex flex-col items-center justify-center gap-0.5 text-sm transition-colors disabled:opacity-30 disabled:cursor-not-allowed"
          [class.text-text-faint]="!cell.inCurrentMonth"
          [class.text-text-primary]="cell.inCurrentMonth && selectedDate() !== cell.iso"
          [class.bg-primary]="selectedDate() === cell.iso"
          [class.text-white]="selectedDate() === cell.iso"
          [class.bg-surface-sunken]="selectedDate() !== cell.iso && cell.inCurrentMonth"
          [class.bg-transparent]="selectedDate() !== cell.iso && !cell.inCurrentMonth"
          [class.ring-2]="cell.isToday && selectedDate() !== cell.iso"
          [class.ring-primary]="cell.isToday && selectedDate() !== cell.iso"
          [class.hover:bg-surface-overlay]="selectedDate() !== cell.iso && !cell.disabled">
          <span class="font-medium">{{ cell.date.getDate() }}</span>
          @if (cell.badge > 0) {
            <span
              class="w-1.5 h-1.5 rounded-full"
              [class.bg-surface-card]="selectedDate() === cell.iso"
              [class.bg-primary]="selectedDate() !== cell.iso">
            </span>
          }
        </button>
      }
    </div>
  }
</div>

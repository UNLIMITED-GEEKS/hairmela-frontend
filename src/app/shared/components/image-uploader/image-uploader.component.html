<label
  class="relative inline-flex items-center gap-1.5 min-h-9 px-3 rounded-lg border border-primary/40 text-primary text-xs font-semibold transition-colors"
  [class.cursor-pointer]="!disabled()"
  [class.hover:bg-primary/5]="!disabled()"
  [class.opacity-50]="disabled()"
  [class.cursor-not-allowed]="disabled()">
  @if (uploading()) {
    <span class="skeleton-pulse h-3.5 w-3.5 rounded-full shrink-0"></span>
    <span>Uploading…</span>
  } @else {
    <svg class="h-3.5 w-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M3 16.5V18a2 2 0 002 2h14a2 2 0 002-2v-1.5M16 10l-4-4m0 0L8 10m4-4v12" />
    </svg>
    <span>{{ label() }}</span>
  }
  <input type="file" accept="image/jpeg,image/png,image/webp" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
    (change)="onFileChange($event)" [disabled]="uploading() || disabled()" />
</label>

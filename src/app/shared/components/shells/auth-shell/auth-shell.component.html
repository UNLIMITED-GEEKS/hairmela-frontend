<div
  class="flex h-screen w-full overflow-hidden bg-surface print:h-auto print:overflow-visible print:bg-surface-card"
>
  <!-- Desktop sidebar -->
  <div class="print:hidden contents">
    <app-sidebar
      [navItems]="navItems()"
      [activeSalonId]="displaySalonId()"
      [membership]="displayMembership()"
      [loggingOut]="loggingOut()"
      (logoutClick)="logout()"
    />
  </div>

  <div class="flex flex-col flex-1 min-w-0 overflow-hidden print:overflow-visible">
    <!-- Desktop top bar -->
    <div class="print:hidden">
      <app-top-bar [showUserAvatar]="true" [salons]="salons()" [activeSalonId]="displaySalonId()" />
    </div>

    <!-- Mobile app header -->
    <div class="print:hidden">
      <app-mobile-top-bar
        [salons]="salons()"
        [activeSalonId]="displaySalonId()"
      />
    </div>

    <!-- Bottom sheet. A SIBLING of the top bar, not projected into it: that
         bar declares backdrop-blur, which creates a stacking context a
         position:fixed child cannot escape — the sheet would be trapped
         inside a 3rem-tall bar.
         #sheet: the bottom nav hides its My Salon tab when this sheet reports
         it has nothing to render (no salon membership, no owned org). -->
    <div class="print:hidden">
      <app-mobile-sheet
        #sheet
        [class.has-center-action]="canQuickAdd() || isCustomer()"
        [navItems]="navItems()"
        [open]="sheetOpen()"
        [activeSalonId]="displaySalonId()"
        [membership]="displayMembership()"
        (closed)="sheetOpen.set(false)"
      />
    </div>

    <!-- Content -->
    <main
      #mainScroll
      class="min-h-0 flex-1 overflow-y-auto pb-bottom-nav print:overflow-visible print:pt-0 print:pb-0"
    >
      <app-pull-to-refresh-indicator />
      <!-- RouterOutlet's own (activate) fires when a route component is
           created, which is exactly when the page should fade. Replacing
           the class on that event restarts the CSS animation without
           tearing the wrapper down. -->
      <div
        #routeWrapper
        class="flex min-h-full flex-col md:block md:min-h-0 w-[95%] mx-auto py-2 print:w-full print:p-0 print:m-0 route-enter"
      >
        <router-outlet (activate)="onRouteActivate()" />
      </div>
    </main>

    <!-- Mobile bottom nav. The My Salon tab opens the sheet the top bar's
         hamburger used to, and is gated on the same emptiness check — #sheet
         is declared on the sheet above, and template refs are visible across
         the whole template. -->
    <div class="print:hidden">
      <app-bottom-nav
        [navItems]="navItems()"
        [showCenterAction]="canQuickAdd() || isCustomer()"
        [centerActionLabel]="canQuickAdd() ? 'Add a client' : 'Search salons'"
        [centerActionIcon]="isCustomer() ? 'search' : 'plus'"
        [showSheetTab]="!sheet.isEmpty()"
        [sheetOpen]="sheetOpen()"
        sheetTabLabel="My Salon"
        sheetTabIcon="scissors"
        (sheetToggle)="sheetOpen.update((v) => !v)"
        (centerAction)="onCenterAction()"
        (navigate)="sheetOpen.set(false)"
      />
    </div>

    @if (appointmentRequest(); as request) {
      <app-add-client-modal
        [open]="true"
        [salonId]="request.salonId"
        [queueId]="request.queueId"
        [staffId]="request.staffId"
        [initialMode]="'appointment'"
        (closed)="closeCreateAppointment()"
      />
    }

    @if (quickAddRequest(); as request) {
      <app-add-client-modal
        [open]="true"
        [salonId]="request.salonId"
        [queueId]="request.queueId"
        [staffId]="request.staffId"
        (closed)="closeQuickAdd()"
      />
    }
  </div>
</div>

<div class="flex h-screen w-full overflow-hidden bg-surface print:h-auto print:overflow-visible print:bg-surface-card">

  <!-- Desktop sidebar -->
  <div class="print:hidden contents">
    <app-sidebar
      [navItems]="navItems"
      [activeSalonId]="displaySalonId()"
      [membership]="displayMembership()"
      (logoutClick)="logout()" />
  </div>

  <div class="flex flex-col flex-1 min-w-0 overflow-hidden print:overflow-visible">

    <!-- Desktop top bar -->
    <div class="print:hidden">
      <app-top-bar
        [showUserAvatar]="true"
        [salons]="salons()"
        [activeSalonId]="displaySalonId()" />
    </div>

    <!-- Mobile top bar + expandable sheet -->
    <div class="print:hidden">
      <app-mobile-top-bar
        [sheetOpen]="sheetOpen()"
        [salons]="salons()"
        [activeSalonId]="displaySalonId()"
        [hideSheetToggle]="sheet.isEmpty()"
        (sheetToggle)="sheetOpen.update(v => !v)">
        <!-- #sheet: the top bar hides its hamburger when this sheet reports it
             has nothing to render (no salon membership, no owned org). -->
        <app-mobile-sheet
          #sheet
          [navItems]="navItems"
          [open]="sheetOpen()"
          [activeSalonId]="displaySalonId()"
          [membership]="displayMembership()"
          (closed)="sheetOpen.set(false)" />
      </app-mobile-top-bar>
    </div>

    <!-- Content -->
    <main #mainScroll class="flex-1 overflow-y-auto pt-8 md:pt-0 pb-bottom-nav print:overflow-visible print:pt-0 print:pb-0">
      <app-pull-to-refresh-indicator />
      <div class="w-[95%] mx-auto py-6 md:py-2 print:w-full print:p-0 print:m-0">
        <router-outlet />
      </div>
    </main>

    <!-- Mobile bottom nav -->
    <div class="print:hidden">
      <app-bottom-nav [navItems]="navItems" />
    </div>
  </div>

</div>

<div class="flex h-screen w-full overflow-hidden bg-surface-raised">

  <!-- Desktop sidebar -->
  <app-sidebar [navItems]="navItems" [showLogout]="false" />

  <div class="flex flex-col flex-1 min-w-0 overflow-hidden">

    <!-- Desktop top bar -->
    <app-top-bar [showUserAvatar]="false" />

    <!-- Mobile top bar + expandable sheet -->
    <app-mobile-top-bar
      [sheetOpen]="sheetOpen()"
      (sheetToggle)="sheetOpen.update(v => !v)">
      <app-mobile-sheet
        [navItems]="navItems"
        [open]="sheetOpen()"
        (closed)="sheetOpen.set(false)" />
    </app-mobile-top-bar>

    <!-- Content -->
    <main class="flex-1 overflow-y-auto pt-8 md:pt-0 pb-12 md:pb-0">
      <div class="w-[95%] mx-auto py-6">
        <router-outlet />
      </div>
    </main>

    <!-- Mobile bottom nav -->
    <app-bottom-nav [navItems]="navItems" />
  </div>

</div>

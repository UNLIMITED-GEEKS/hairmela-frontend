<div class="flex h-screen w-full overflow-hidden bg-surface">

  <!-- Desktop sidebar -->
  <app-sidebar [navItems]="navItems" [showLogout]="false" [isGuest]="true" />

  <div class="flex flex-col flex-1 min-w-0 overflow-hidden">

    <!-- Desktop top bar -->
    <app-top-bar [showUserAvatar]="false" />

    <!-- Mobile top bar -->
    <app-mobile-top-bar [isGuest]="true" />

    <!-- Content -->
    <main #mainScroll class="flex-1 overflow-y-auto pt-8 md:pt-0 pb-bottom-nav">
      <app-pull-to-refresh-indicator />
      <!-- RouterOutlet's own (activate) fires when a route component is
           created, which is exactly when the page should fade. Replacing
           the class on that event restarts the CSS animation without
           tearing the wrapper down. -->
      <div #routeWrapper class="w-[95%] mx-auto py-6 md:py-2 route-enter">
        <router-outlet (activate)="onRouteActivate()" />
      </div>
    </main>

    <!-- Mobile bottom nav -->
    <app-bottom-nav [navItems]="navItems" />
  </div>

</div>

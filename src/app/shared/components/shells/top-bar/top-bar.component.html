<header class="hidden md:flex items-center justify-between h-16 px-6 bg-surface border-b border-border shrink-0">

  <!-- Salon switcher -->
  @if (salons().length > 0) {
    <div class="relative">
      <button
        (click)="toggleDropdown()"
        class="flex items-center gap-2 px-6 py-2 rounded-xl hover:bg-surface-overlay transition-colors min-h-[44px]"
        aria-haspopup="listbox"
        [attr.aria-expanded]="dropdownOpen()">
        <div class="flex flex-col items-start">
          <span class="text-xs text-text-secondary font-medium leading-none mb-0.5">Salon</span>
          <span class="text-sm font-bold text-text-primary leading-none">
            {{ activeSalon()?.salon?.name ?? 'Select salon' }}
          </span>
        </div>
        <svg class="w-4 h-4 text-text-secondary transition-transform duration-200 shrink-0"
          [class.rotate-180]="dropdownOpen()"
          fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
      </button>

      @if (dropdownOpen()) {
        <!-- Backdrop -->
        <div class="fixed inset-0 z-10" (click)="closeDropdown()" aria-hidden="true"></div>

        <!-- Dropdown -->
        <ul
          role="listbox"
          class="absolute left-0 top-full mt-1 z-20 min-w-[200px] bg-surface-card border border-border rounded-2xl shadow-lg py-1 overflow-hidden">
          @for (item of salons(); track item.salon.id) {
            <li>
              <button
                role="option"
                [attr.aria-selected]="item.salon.id === activeSalonId()"
                (click)="switchSalon(item.salon.id)"
                class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-left hover:bg-surface-overlay transition-colors min-h-[44px]"
                [class.text-primary]="item.salon.id === activeSalonId()"
                [class.font-semibold]="item.salon.id === activeSalonId()"
                [class.text-text-primary]="item.salon.id !== activeSalonId()">
                <span class="w-7 h-7 rounded-full bg-primary/10 text-primary flex items-center justify-center text-xs font-bold shrink-0">
                  {{ item.salon.name.charAt(0).toUpperCase() }}
                </span>
                <span class="min-w-0 flex-1">
                  <span class="block truncate">{{ item.salon.name }}</span>
                  @if (isAmbiguous(item.salon.name)) {
                    <span class="block text-xs text-text-secondary font-normal truncate">{{ item.salon.slug }}</span>
                  }
                </span>
                @if (item.salon.id === activeSalonId()) {
                  <svg class="w-4 h-4 ml-auto shrink-0 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                  </svg>
                }
              </button>
            </li>
          }
        </ul>
      }
    </div>
  } @else {
    <div></div>
  }

  <!-- Right: avatar -->
  @if (showUserAvatar() && _currentUser.user(); as user) {
    <app-avatar
      [name]="user.firstName + ' ' + user.lastName"
      size="sm" />
  } @else {
    <div class="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center">
      <svg class="w-4 h-4 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
      </svg>
    </div>
  }

</header>

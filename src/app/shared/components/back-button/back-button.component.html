@if (variant() === 'glass') {
  <button type="button" (click)="goBack()"
    aria-label="Go back"
    class="flex h-10 w-10 items-center justify-center rounded-full bg-surface-card/40 dark:bg-surface-card/40 backdrop-blur-md border border-border/40 dark:border-white/20 text-text-primary dark:text-white shadow-xs hover:bg-surface-card dark:hover:bg-surface-card/60 transition-colors">
    <app-icon name="chevron-left" class="w-2 h-3.5" />
  </button>
} @else if (variant() === 'surface') {
  <button type="button" (click)="goBack()"
    aria-label="Go back"
    class="page-header-action flex h-10 w-10 items-center justify-center rounded-full bg-surface-overlay/50 text-text-primary hover:bg-surface-strong transition-colors">
    <app-icon name="chevron-left" class="w-2 h-3.5" />
  </button>
} @else {
  <button type="button" (click)="goBack()"
    aria-label="Go back"
    class="min-w-11 min-h-11 flex items-center justify-center text-text-disabled hover:text-primary -ml-2 shrink-0">
    <app-icon name="chevron-left" class="w-2 h-3.5" />
  </button>
}

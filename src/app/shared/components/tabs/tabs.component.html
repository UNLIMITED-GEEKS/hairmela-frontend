<div class="relative flex gap-1 bg-gray-100 p-1 rounded-lg" role="tablist">
  <!-- Sliding active-tab pill -->
  <div
    class="absolute top-1 bottom-1 bg-white rounded-md shadow-sm transition-[transform,width] duration-250 ease-out"
    [style]="indicatorStyle()">
  </div>

  @for (tab of tabs(); track tab.id) {
    <button #tabBtn type="button"
      role="tab"
      [attr.aria-selected]="tab.id === activeId()"
      (click)="select(tab.id)"
      [class]="'relative z-10 flex-1 min-h-9 text-sm font-medium rounded-md transition-colors duration-200 cursor-pointer ' +
        (tab.id === activeId() ? 'text-gray-900' : 'text-gray-500 hover:text-gray-700')">
      {{ tab.label }}
    </button>
  }
</div>

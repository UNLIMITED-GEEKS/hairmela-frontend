<div class="relative flex gap-2" role="tablist" [class.w-fit]="fitContent()">
  <!-- Sliding active-tab pill -->
  <div
    class="absolute top-0 bottom-0 bg-primary rounded-xl transition-[transform,width] duration-250 ease-out"
    [style]="indicatorStyle()">
  </div>

  @for (tab of tabs(); track tab.id) {
    <button #tabBtn type="button"
      role="tab"
      [attr.aria-selected]="tab.id === activeId()"
      (click)="select(tab.id)"
      [class]="'relative z-10 flex-1 min-h-9 px-3 text-sm font-semibold rounded-xl border transition-colors duration-200 cursor-pointer whitespace-nowrap ' +
        (tab.id === activeId() ? 'text-white border-transparent' : 'text-gray-600 border-gray-200 hover:bg-gray-50')">
      @if (tab.shortLabel) {
        <span class="sm:hidden">{{ tab.shortLabel }}</span>
        <span class="hidden sm:inline">{{ tab.label }}</span>
      } @else {
        {{ tab.label }}
      }
    </button>
  }
</div>

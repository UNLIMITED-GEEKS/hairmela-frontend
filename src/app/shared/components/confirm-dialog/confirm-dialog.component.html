@if (dialog.state(); as state) {
  <!-- Backdrop -->
  <div
    class="fixed inset-0 z-50 flex items-center justify-center px-4"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="'dialog-title'">

    <!-- Overlay -->
    <div class="fixed inset-0 bg-black/50 transition-opacity" (click)="dialog.cancel()"></div>

    <!-- Panel -->
    <div class="relative w-full sm:max-w-sm bg-white rounded-2xl shadow-xl p-6 space-y-4 animate-fade-in">

      <h2 id="dialog-title" class="text-base font-semibold text-gray-900">{{ state.title }}</h2>
      <p class="text-sm text-gray-500 leading-relaxed">{{ state.message }}</p>

      <div class="flex gap-3 pt-1">
        <button
          type="button"
          (click)="dialog.cancel()"
          class="flex-1 min-h-11 border border-gray-300 text-gray-700 text-sm font-medium
                 rounded-lg hover:bg-gray-50 active:scale-95 transition-all">
          {{ state.cancelLabel ?? 'Cancel' }}
        </button>
        <button
          type="button"
          (click)="dialog.confirm()"
          class="flex-1 min-h-11 text-sm font-medium rounded-lg active:scale-95 transition-all"
          [class]="state.danger
            ? 'bg-red-600 text-white hover:bg-red-700'
            : 'bg-primary text-white hover:bg-primary-dark'">
          {{ state.confirmLabel ?? 'Confirm' }}
        </button>
      </div>

    </div>
  </div>
}

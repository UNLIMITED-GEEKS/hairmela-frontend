@if (items().length === 0) {
  <p class="text-sm text-text-disabled text-center py-4">No photos yet</p>
} @else {
  <div cdkDropList cdkDropListOrientation="mixed"
    class="grid grid-cols-3 gap-2 sm:grid-cols-4"
    (cdkDropListDropped)="drop($event)">
    @for (item of items(); track item.id) {
      <div cdkDrag [cdkDragDisabled]="!canEdit()"
        class="relative aspect-square rounded-lg overflow-hidden bg-surface-overlay">
        <img [src]="item.url | mediaUrl:'grid'" alt="Gallery photo"
          class="object-cover w-full h-full" />
        @if (canEdit()) {
          <button type="button" (click)="deleteItem(item)"
            class="absolute top-1 right-1 w-7 h-7 rounded-full bg-primary flex items-center justify-center text-white hover:bg-primary-hover transition-colors shadow"
            aria-label="Delete photo">
            <app-icon name="close" class="w-4 h-4" />
          </button>
        }
      </div>
    }
  </div>
}

<button type="button" (click)="select.emit()"
  class="w-full rounded-xl border border-gray-200 bg-white px-4 py-3.5
         flex items-center gap-3 text-left
         hover:bg-gray-50 transition-colors">

  <div class="w-10 h-10 shrink-0 rounded-xl bg-secondary-light flex items-center justify-center">
    <app-icon name="scissors" class="w-3.5 h-4 text-primary" />
  </div>

  <div class="flex-1 min-w-0">
    <h3 class="text-sm font-semibold text-gray-900 truncate">{{ service().name }}</h3>
    @if (service().description) {
      <p class="text-xs text-gray-500 truncate">{{ service().description }}</p>
    }
  </div>

  <div class="shrink-0 text-right">
    <p class="text-sm font-bold text-gray-900">₦{{ service().price }}</p>
    <p class="text-xs text-gray-500">{{ service().duration }}mins</p>
  </div>

</button>

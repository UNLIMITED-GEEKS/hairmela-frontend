<button type="button" (click)="select.emit()"
  class="w-full rounded-xl border border-border bg-surface-card px-4 py-3.5
         flex items-start gap-3 text-left
         hover:bg-surface-sunken transition-colors">

  <div class="w-10 h-10 shrink-0 rounded-xl bg-secondary-light flex items-center justify-center">
    <app-icon name="scissors" class="w-3.5 h-4 text-primary" />
  </div>

  <!-- Wraps rather than truncating: a service name is the whole point of the
       row, and salons write long ones. wrap-break-word so an unbroken string
       (no spaces) still wraps instead of overflowing the container. -->
  <div class="flex-1 min-w-0 pt-1">
    <h3 class="text-sm font-semibold text-text-primary wrap-break-word">{{ service().name }}</h3>
    @if (service().description) {
      <p class="text-xs text-text-secondary wrap-break-word">{{ service().description }}</p>
    }
  </div>

  <div class="shrink-0 max-w-28 text-right pt-1">

    @if (showPrice()) {
      @if (service().isDynamicPricing) {
        <p class="text-xs font-medium text-text-muted wrap-break-word">Price is based on your choosen style</p>
      } @else {
        <span class="text-xs text-text-muted">From</span>
        <p class="text-sm font-bold text-text-primary">  {{ service().price | currencyNgn: currency() }}</p>
      }
    }
    <p class="text-xs text-text-secondary">{{ service().duration }}mins</p>
  </div>

</button>

@if (_currentUser.user()) {
  <header class="fixed top-0 inset-x-0 z-40 bg-white border-b border-gray-200 flex items-center justify-between px-4 h-12">
    <span class="text-sm font-bold text-primary">HairMela</span>
    <div class="flex items-center gap-1">
      <a
        routerLink="/notifications"
        class="min-h-11 min-w-11 flex items-center justify-center text-gray-500 hover:text-primary transition-colors"
        aria-label="Notifications">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
        </svg>
      </a>
      <button
        (click)="_auth.logout()"
        class="text-sm font-medium text-gray-600 hover:text-red-600 min-h-11 min-w-11 flex items-center justify-end transition-colors">
        Logout
      </button>
    </div>
  </header>
  <div class="pt-12">
    <router-outlet />
  </div>
} @else {
  <router-outlet />
}
<app-toast />
<app-confirm-dialog />

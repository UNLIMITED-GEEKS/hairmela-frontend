<div class="min-h-screen flex flex-col items-center justify-center px-5 text-center">
  <p class="text-sm font-medium uppercase tracking-wide text-primary">404</p>
  <h1 class="mt-2 text-2xl sm:text-4xl font-bold text-text-primary">Page not found</h1>
  <p class="mt-3 max-w-md text-sm text-text-secondary">
    The page you're looking for doesn't exist or may have been moved.
  </p>
  <a [routerLink]="homeLink()"
    class="mt-8 inline-flex min-h-11 items-center justify-center rounded-lg bg-primary px-6 text-sm font-medium text-white hover:bg-primary-dark transition-colors">
    Go home
  </a>
</div>

<div class="min-h-screen px-5 pt-28 pb-16">
  <div class="max-w-2xl mx-auto">

    <!-- Heading -->
    <div class="text-center">
      <p class="text-xs font-medium uppercase tracking-wide text-primary">Contact</p>
      <h1 class="mt-1 text-2xl sm:text-3xl font-bold text-gray-900">Get in touch</h1>
      <p class="mt-2 text-sm text-gray-500">
        Questions about HairMela, your plan, or running your salon? Send us a message.
      </p>
    </div>

    <div class="mt-10 rounded-2xl border border-gray-200 bg-white p-6 sm:p-8">

      @if (sent()) {
        <!-- Success state -->
        <div class="py-8 text-center">
          <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-green-100">
            <svg class="h-6 w-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
          </div>
          <h2 class="mt-4 text-lg font-bold text-gray-900">Message sent</h2>
          <p class="mt-1 text-sm text-gray-500">Thanks for reaching out, we'll get back to you soon.</p>
          <button type="button" (click)="sendAnother()"
            class="mt-5 text-sm font-semibold text-primary hover:text-primary-hover transition-colors">
            Send another message
          </button>
        </div>
      } @else {
        <form #formEl [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">

          <!-- Name -->
          <div>
            <label for="contact-name" class="block text-sm font-medium text-gray-700 mb-1.5">Full name</label>
            <input
              id="contact-name"
              type="text"
              formControlName="name"
              autocomplete="name"
              placeholder="Your name"
              class="w-full min-h-11 px-3 py-2.5 text-sm border border-gray-300 rounded-lg
                     focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition-colors"
              [class.border-red-400]="form.get('name')?.invalid && form.get('name')?.touched" />
            <app-field-error
              [control]="form.get('name')"
              [messages]="{ required: 'Please enter your name.' }" />
          </div>

          <!-- Email -->
          <div>
            <label for="contact-email" class="block text-sm font-medium text-gray-700 mb-1.5">Email address</label>
            <input
              id="contact-email"
              type="email"
              formControlName="email"
              autocomplete="email"
              placeholder="you@example.com"
              class="w-full min-h-11 px-3 py-2.5 text-sm border border-gray-300 rounded-lg
                     focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition-colors"
              [class.border-red-400]="form.get('email')?.invalid && form.get('email')?.touched" />
            <app-field-error [control]="form.get('email')" />
          </div>

          <!-- Phone -->
          <div>
            <label for="contact-phone" class="block text-sm font-medium text-gray-700 mb-1.5">Phone number</label>
            <input
              id="contact-phone"
              type="tel"
              formControlName="phone"
              autocomplete="tel"
              placeholder="Your phone number"
              class="w-full min-h-11 px-3 py-2.5 text-sm border border-gray-300 rounded-lg
                     focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition-colors"
              [class.border-red-400]="form.get('phone')?.invalid && form.get('phone')?.touched" />
            <app-field-error
              [control]="form.get('phone')"
              [messages]="{ required: 'Please enter your phone number.' }" />
          </div>

          <!-- Message -->
          <div>
            <label for="contact-message" class="block text-sm font-medium text-gray-700 mb-1.5">Your message</label>
            <textarea
              id="contact-message"
              formControlName="message"
              rows="6"
              placeholder="How can we help?"
              class="w-full px-3 py-2.5 text-sm border border-gray-300 rounded-lg resize-none
                     focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition-colors"
              [class.border-red-400]="form.get('message')?.invalid && form.get('message')?.touched"></textarea>
            <app-field-error
              [control]="form.get('message')"
              [messages]="{ required: 'Please write a message.', minlength: 'Message is a little short, add a few more details.' }" />
          </div>

          <button type="submit" [disabled]="submitting()"
            class="w-full min-h-11 rounded-lg bg-primary text-white text-sm font-semibold
                   hover:bg-primary-hover disabled:opacity-50 transition-colors">
            {{ submitting() ? 'Sending…' : 'Send message' }}
          </button>
        </form>
      }

    </div>

    <p class="mt-6 text-center text-xs text-gray-400">
      Prefer email? Reach us at
      <a href="mailto:hello@contact.hairmela.com" class="text-primary font-medium hover:underline">hello&#64;hairmela.com</a>
    </p>

  </div>
</div>

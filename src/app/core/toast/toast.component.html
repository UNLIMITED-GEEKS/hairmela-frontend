<div
  class="pointer-events-none fixed inset-x-4 bottom-[calc(var(--bottom-nav-height)+0.75rem)] z-[100] mx-auto flex max-w-md flex-col gap-2.5 md:bottom-6"
  aria-live="polite"
  aria-atomic="false"
>
  @for (toast of _toastService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex min-h-14 items-center gap-3 rounded-2xl border bg-surface-card/95 p-3 shadow-modal backdrop-blur-md animate-fade-in"
      [class]="
        toast.type === 'success'
          ? 'border-success/20'
          : toast.type === 'error'
            ? 'border-error/20'
            : 'border-info/20'
      "
      [attr.role]="toast.type === 'error' ? 'alert' : 'status'"
    >
      <span
        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full"
        [class]="
          toast.type === 'success'
            ? 'bg-success-light text-success'
            : toast.type === 'error'
              ? 'bg-error-light text-error'
              : 'bg-info-light text-info'
        "
        aria-hidden="true"
      >
        @if (toast.type === 'success') {
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path
              d="m5 12 4 4L19 6"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
            />
          </svg>
        } @else if (toast.type === 'error') {
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path
              d="M12 8v5m0 3h.01M10.3 4.5 2.8 17.3A2 2 0 0 0 4.5 20h15a2 2 0 0 0 1.7-2.7L13.7 4.5a2 2 0 0 0-3.4 0Z"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
            />
          </svg>
        } @else {
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path
              d="M12 16v-4m0-4h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
            />
          </svg>
        }
      </span>

      <p class="min-w-0 flex-1 text-sm font-medium leading-5 text-text-primary">
        {{ toast.message }}
      </p>

      <button
        type="button"
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-text-muted transition-colors hover:bg-surface-overlay hover:text-text-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/40"
        (click)="_toastService.dismiss(toast.id)"
        aria-label="Dismiss notification"
      >
        <svg
          class="h-4 w-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          aria-hidden="true"
        >
          <path d="m6 6 12 12M18 6 6 18" stroke-linecap="round" stroke-width="2" />
        </svg>
      </button>
    </div>
  }
</div>

<svg viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Ring: full circle stroke with a gap left open via dasharray, rotated so the gap sits bottom-right -->
  <circle
    cx="600" cy="570" r="310"
    fill="none"
    stroke="#ffffff"
    stroke-width="92"
    stroke-linecap="round"
    stroke-dasharray="1696 252"
    transform="rotate(78 600 570)"
  />
  <!-- Dot: sits in the gap, completing the mark -->
  <circle cx="762" cy="801" r="62" fill="#660029" />
</svg>
